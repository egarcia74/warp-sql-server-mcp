# CI scanner configuration. SONAR_CI_ENABLED must remain false/unset until
# Automatic Analysis is disabled; the two analysis methods cannot overlap.
sonar.projectKey=egarcia74_warp-sql-server-mcp
sonar.organization=egarcia74
sonar.sources=.
sonar.tests=test
sonar.test.inclusions=test/**
sonar.exclusions=test/docker/init-db.sql
sonar.test.exclusions=test/docker/init-db.sql
# Measure shipped MCP runtime and CLI only; retain maintenance scripts in issue analysis.
sonar.coverage.exclusions=scripts/**,eslint.config.js,vitest.config.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Temporary contributor-fork trust-boundary probe for draft PR #1430.
# The privileged follow-up must discard this file and restore trusted main settings.
# If it does not, the unreachable loopback endpoint prevents an unintended upload.
# Keep the values enforced by the normal CI scanner contract unchanged.
sonar.host.url=http://127.0.0.1:9
sonar.pullrequest.base=not-main
sonar.pullrequest.branch=not-the-fork-branch
