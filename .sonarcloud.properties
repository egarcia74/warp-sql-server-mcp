# SonarCloud Automatic Analysis configuration.
#
# This project is analysed by SonarCloud Automatic Analysis - there is no scanner
# step in any workflow. Automatic Analysis reads its configuration from THIS file
# only: a sonar-project.properties file is ignored, and only the keys documented at
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
# are honoured (sonar.sources / sonar.exclusions / sonar.inclusions, sonar.tests /
# sonar.test.exclusions / sonar.test.inclusions, sonar.sourceEncoding,
# sonar.cpd.exclusions, plus Python/C++ version keys). Wildcard patterns are not
# allowed. A value set here overrides the same setting in the SonarCloud UI.
#
# Why test/docker/init-db.sql is excluded:
#   The file is Microsoft SQL Server T-SQL (GO batch separators, IDENTITY,
#   NVARCHAR), but SonarCloud maps *.sql to its Oracle PL/SQL analyser (instance
#   default sonar.plsql.file.suffixes=sql,tab,pkb) and runs plsql:* rules on it.
#   That produced 10 findings that are wrong for T-SQL - plsql:CharVarchar
#   "Use NVARCHAR2 instead of NCHAR" (NVARCHAR2 is an Oracle type that does not
#   exist in SQL Server) and nine plsql:S1192 duplicate-literal findings.
#   sonar.plsql.file.suffixes is not a key Automatic Analysis honours, so the
#   file is excluded by path instead. SonarCloud indexes it as a main source
#   file (qualifier FIL, not a test file), so sonar.exclusions is the key that
#   applies. It is the only .sql file in the repository; if another is added,
#   list it here too (comma-separated, no wildcards).
#
# Nothing else under test/ is excluded: Sonar findings on the JavaScript test
# code are wanted.
sonar.exclusions=test/docker/init-db.sql
