name: Documentation Automation

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - 'README.md'
      - 'index.js'
      # cli.js and lib/** are the rest of the shipped code the env-var doc-sync
      # check scans; without them a new process.env read lands without the gate
      # ever running on the PR that introduced it.
      - 'cli.js'
      - 'lib/**'
      - 'package.json'
      - 'scripts/docs/**'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - 'README.md'
      - 'index.js'
      # cli.js and lib/** are the rest of the shipped code the env-var doc-sync
      # check scans; without them a new process.env read lands without the gate
      # ever running on the PR that introduced it.
      - 'cli.js'
      - 'lib/**'
      - 'package.json'
      - 'scripts/docs/**'
  schedule:
    # Weekly documentation health check
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts blocks dependency lifecycle scripts (supply-chain
        # hardening); the docs tooling is pure JS and does not need them.
        run: npm ci --ignore-scripts

      - name: Validate markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/markdown-link-check.json'
          folder-path: '.'
          max-depth: 4

      - name: Check for broken internal links
        run: |
          echo "## 🔍 Documentation Link Validation" > link-report.md
          echo "" >> link-report.md

          # Check if we have any markdown files
          if find . -name "*.md" -not -path "./node_modules/*" | head -1 | grep -q .; then
            echo "✅ Markdown files found, validation completed by link checker" >> link-report.md
          else
            echo "⚠️ No markdown files found for validation" >> link-report.md
          fi

          # Check README sections
          if grep -q "## Table of Contents\|## Features\|## Installation" README.md; then
            echo "✅ README.md has proper sections" >> link-report.md
          else
            echo "⚠️ README.md might be missing standard sections" >> link-report.md
          fi

      # The two checks below REPORT drift; they do not enforce it. Enforcement lives in
      # ci.yml's `lint` job (`Code Quality & Linting`), which runs the same two scripts via
      # `npm run docs:check` and IS a required status check on main. This job is deliberately
      # not required - its link checker 404s on still-private GHSA advisories and goes red
      # during a security release - so a gate that only ran here would go red and still merge,
      # which is exactly what #1252 was opened to prevent.
      #
      # They stay here because `link-report.md` is how a reviewer sees WHAT drifted; the
      # required check in ci.yml only says THAT it did. `continue-on-error: true` keeps a
      # drift from failing this job, so the red X a reviewer chases is the actionable one in
      # ci.yml rather than a duplicate here. They run before the artifact upload, which is
      # `if: always()` so the report is published either way.
      - name: Check every doc is reachable from the nav
        # `if: always()` for the same reason as the step below, and for the step above it
        # too: without it this inherits the implicit `success()` condition and is SKIPPED
        # whenever an earlier step in the job fails - the link validation, for instance. A
        # run that reports only the first drift, then publishes a report with the
        # reachability section missing entirely, hides orphan drift behind a broken link.
        # Both checks are independent and both should be visible from one run.
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          echo "" >> link-report.md
          echo "### 🗺️ Documentation Nav Reachability" >> link-report.md
          echo "" >> link-report.md
          node scripts/docs/check-orphan-docs.mjs | tee -a link-report.md

      - name: Check environment variable documentation matches the code
        # `if: always()` for the same reason as the step above: without it this inherits
        # the implicit `success()` condition and is SKIPPED whenever ANY earlier step in
        # the job fails - the orphan check, or the link validation before it. The checks are
        # independent, and a run that reports only the first drift - then publishes a
        # report with the env-var section missing entirely - hides the second behind the
        # first. Both should be visible from one run.
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          echo "" >> link-report.md
          echo "### ⚙️ Environment Variable Doc Sync" >> link-report.md
          echo "" >> link-report.md
          node scripts/docs/check-env-var-docs.mjs | tee -a link-report.md

      - name: Upload documentation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: documentation-validation-report
          path: link-report.md
          retention-days: 30

  update-toc:
    name: Check Table of Contents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Check if TOC needs update
        run: |
          echo "## 📑 Table of Contents Check" > toc-check-report.md
          echo "" >> toc-check-report.md

          # Simple check for basic README structure
          if grep -q "## Table of Contents" README.md; then
            echo "✅ Table of Contents section exists" >> toc-check-report.md
          else
            echo "ℹ️ No Table of Contents found - could be added for better navigation" >> toc-check-report.md
          fi

          # Check for proper heading structure
          heading_count=$(grep -c "^#" README.md || true)
          echo "📊 Found $heading_count headings in README.md" >> toc-check-report.md

          if [ $heading_count -gt 5 ]; then
            echo "💡 With $heading_count headings, a Table of Contents would improve navigation" >> toc-check-report.md
          fi

      - name: Upload TOC check report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: toc-check-report
          path: toc-check-report.md
          retention-days: 30

  check-outdated-docs:
    name: Check for Outdated Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Check documentation freshness
        run: |
          echo "## 📅 Documentation Freshness Report" > freshness-report.md
          echo "" >> freshness-report.md

          # Check when each markdown file was last updated
          echo "### File Last Modified Dates" >> freshness-report.md
          echo "" >> freshness-report.md
          echo "| File | Last Modified | Days Ago |" >> freshness-report.md
          echo "|------|---------------|----------|" >> freshness-report.md

          find . -name "*.md" -not -path "./node_modules/*" | while read file; do
            if [ -f "$file" ]; then
              last_modified=$(git log -1 --format="%ci" -- "$file" 2>/dev/null || echo "Unknown")
              if [ "$last_modified" != "Unknown" ]; then
                days_ago=$(( ($(date +%s) - $(date -d "$last_modified" +%s)) / 86400 ))
                echo "| $file | $last_modified | $days_ago |" >> freshness-report.md
              else
                echo "| $file | Never committed | N/A |" >> freshness-report.md
              fi
            fi
          done

          echo "" >> freshness-report.md

          # Check for very old files (>90 days)
          echo "### 🚨 Potentially Outdated Files" >> freshness-report.md
          echo "" >> freshness-report.md

          old_files_found=false
          find . -name "*.md" -not -path "./node_modules/*" | while read file; do
            if [ -f "$file" ]; then
              last_modified=$(git log -1 --format="%ci" -- "$file" 2>/dev/null)
              if [ -n "$last_modified" ]; then
                days_ago=$(( ($(date +%s) - $(date -d "$last_modified" +%s)) / 86400 ))
                if [ $days_ago -gt 90 ]; then
                  echo "⚠️ **$file** - Not updated in $days_ago days" >> freshness-report.md
                  old_files_found=true
                fi
              fi
            fi
          done

          if [ "$old_files_found" != "true" ]; then
            echo "✅ All documentation files are reasonably fresh" >> freshness-report.md
          fi

      - name: Upload freshness report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: documentation-freshness-report
          path: freshness-report.md
          retention-days: 30

  generate-api-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    outputs:
      tools_count: ${{ steps.describe-generated-docs.outputs.tools_count }}
      docs_index_sha256: ${{ steps.describe-generated-docs.outputs.docs_index_sha256 }}
      docs_tools_sha256: ${{ steps.describe-generated-docs.outputs.docs_tools_sha256 }}
      tools_json_sha256: ${{ steps.describe-generated-docs.outputs.tools_json_sha256 }}
    steps:
      - name: Checkout exact main commit
        id: checkout-source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts blocks dependency lifecycle scripts (supply-chain
        # hardening); the docs tooling is pure JS and does not need them.
        run: npm ci --ignore-scripts

      - name: Extract MCP Tools Documentation
        run: |
          echo "🔍 Extracting MCP tools from source code..."
          node scripts/docs/extract-docs.js

      - name: Generate HTML Documentation
        run: |
          echo "🏗️ Generating comprehensive HTML documentation..."
          node scripts/docs/generate-tools-html.js
          node scripts/docs/generate-landing-page.js

          echo "📊 Documentation generation complete:"
          echo "- Landing page: docs/index.html"
          echo "- Tools documentation: docs/tools.html"
          echo "- Tools data: docs-data/tools.json"

      - name: Describe generated documentation
        id: describe-generated-docs
        shell: bash
        run: |
          set -euo pipefail
          tool_count=$(node -e "const {toolsCount} = require('./docs-data/tools.json'); if (!Number.isSafeInteger(toolsCount) || toolsCount < 1 || toolsCount > 999) process.exit(1); console.log(toolsCount);")
          echo "✅ Successfully generated documentation for $tool_count MCP tools"
          {
            echo "tools_count=$tool_count"
            echo "docs_index_sha256=$(sha256sum docs/index.html | cut -d' ' -f1)"
            echo "docs_tools_sha256=$(sha256sum docs/tools.html | cut -d' ' -f1)"
            echo "tools_json_sha256=$(sha256sum docs-data/tools.json | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload generated documentation
        id: upload-generated-docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: generated-documentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/index.html
            docs/tools.html
            docs-data/tools.json
          if-no-files-found: error
          retention-days: 30

  create-docs-pr:
    name: Create documentation update PR
    needs: generate-api-docs
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit
        id: checkout-main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download same-run generated documentation
        id: download-generated-docs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-documentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generated-docs

      - name: Validate and stage generated documentation
        id: validate-generated-docs
        shell: bash
        env:
          DOCS_INDEX_SHA256: ${{ needs.generate-api-docs.outputs.docs_index_sha256 }}
          DOCS_TOOLS_SHA256: ${{ needs.generate-api-docs.outputs.docs_tools_sha256 }}
          TOOLS_JSON_SHA256: ${{ needs.generate-api-docs.outputs.tools_json_sha256 }}
          TOOLS_COUNT: ${{ needs.generate-api-docs.outputs.tools_count }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/generated-docs"
          if [[ ! -d "$artifact_dir" ]]; then
            echo '::error::Generated documentation artifact is missing' >&2
            exit 1
          fi
          if [[ ! $TOOLS_COUNT =~ ^[1-9][0-9]{0,2}$ ]]; then
            echo '::error::Generated tool count is not a bounded integer' >&2
            exit 1
          fi

          # Only these two directories and three regular files may cross the
          # artifact boundary. The files are data; this job never executes them.
          while IFS= read -r -d '' entry; do
            relative="${entry#"$artifact_dir"/}"
            case "$relative" in
              docs|docs-data)
                [[ -d "$entry" && ! -L "$entry" ]] || exit 1
                ;;
              docs/index.html|docs/tools.html|docs-data/tools.json)
                [[ -f "$entry" && ! -L "$entry" ]] || exit 1
                ;;
              *)
                echo "::error::Unexpected artifact path: $relative" >&2
                exit 1
                ;;
            esac
          done < <(find "$artifact_dir" -mindepth 1 -print0)

          for relative in docs/index.html docs/tools.html docs-data/tools.json; do
            [[ -f "$artifact_dir/$relative" && ! -L "$artifact_dir/$relative" ]] || {
              echo "::error::Missing generated file: $relative" >&2
              exit 1
            }
          done

          for digest in "$DOCS_INDEX_SHA256" "$DOCS_TOOLS_SHA256" "$TOOLS_JSON_SHA256"; do
            [[ $digest =~ ^[0-9a-f]{64}$ ]] || {
              echo '::error::Malformed generated file digest' >&2
              exit 1
            }
          done
          [[ $(sha256sum "$artifact_dir/docs/index.html" | cut -d' ' -f1) == "$DOCS_INDEX_SHA256" ]] || exit 1
          [[ $(sha256sum "$artifact_dir/docs/tools.html" | cut -d' ' -f1) == "$DOCS_TOOLS_SHA256" ]] || exit 1
          [[ $(sha256sum "$artifact_dir/docs-data/tools.json" | cut -d' ' -f1) == "$TOOLS_JSON_SHA256" ]] || exit 1

          cd "$GITHUB_WORKSPACE"
          [[ -z $(git status --porcelain) ]] || {
            echo '::error::Writer checkout is not clean' >&2
            exit 1
          }
          cp "$artifact_dir/docs/index.html" docs/index.html
          cp "$artifact_dir/docs/tools.html" docs/tools.html
          cp "$artifact_dir/docs-data/tools.json" docs-data/tools.json
          git add -- docs/index.html docs/tools.html docs-data/tools.json

          while IFS= read -r relative; do
            case "$relative" in
              docs/index.html|docs/tools.html|docs-data/tools.json) ;;
              *) echo "::error::Unexpected staged path: $relative" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)

          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No documentation changes to commit'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create documentation PR with DOCS_PAT
        id: create-documentation-pr
        if: steps.validate-generated-docs.outputs.changed == 'true'
        shell: bash
        env:
          DOCS_PAT: ${{ secrets.DOCS_PAT }}
          TOOLS_COUNT: ${{ needs.generate-api-docs.outputs.tools_count }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCS_PAT:-}" ]]; then
            echo '::error::DOCS_PAT is required to push a generated documentation update and trigger its PR checks' >&2
            exit 1
          fi
          [[ $TOOLS_COUNT =~ ^[1-9][0-9]{0,2}$ ]] || exit 1
          [[ $GITHUB_RUN_ID =~ ^[1-9][0-9]*$ && $GITHUB_RUN_ATTEMPT =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ $GITHUB_REPOSITORY =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1

          origin_url=$(git remote get-url origin)
          if [[ "$origin_url" != "https://github.com/$GITHUB_REPOSITORY" && "$origin_url" != "https://github.com/$GITHUB_REPOSITORY.git" ]]; then
            echo '::error::Checkout origin is not the expected token-free repository URL' >&2
            exit 1
          fi

          branch_name="docs/auto-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git -c core.hooksPath=/dev/null commit -m 'docs: auto-update API documentation' -m "Generated from the main commit; extracted $TOOLS_COUNT MCP tools."

          # Do not put the PAT in a URL, argument, git config, or log. The
          # ephemeral helper reads it only when Git asks for HTTPS credentials.
          askpass=$(mktemp "$RUNNER_TEMP/docs-askpass.XXXXXX")
          pr_body=$(mktemp "$RUNNER_TEMP/docs-pr-body.XXXXXX")
          trap 'rm -f "$askpass" "$pr_body"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DOCS_PAT" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"

          if ! GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -c core.hooksPath=/dev/null -c credential.helper= push origin "HEAD:refs/heads/$branch_name"; then
            echo "::error::Documentation push failed for $branch_name; no PR was created" >&2
            exit 1
          fi

          cat > "$pr_body" <<'PR_BODY'
          ## 🤖 Automated Documentation Update

          This PR contains automatically generated documentation updates.

          ### 📊 Changes
          - **Tools documented**: __TOOL_COUNT__ MCP tools
          - **Generated files**:
            - `docs/index.html` - Landing page with tool overview
            - `docs/tools.html` - Comprehensive API documentation
            - `docs-data/tools.json` - Structured tool data

          ### 📋 Review Checklist
          - [ ] Tool count matches expected number
          - [ ] HTML files are properly formatted
          - [ ] No sensitive information exposed
          - [ ] Documentation reflects current codebase
          PR_BODY
          body_template=$(< "$pr_body")
          printf '%s\n' "${body_template//__TOOL_COUNT__/$TOOLS_COUNT}" > "$pr_body"

          # REST accepts fine-grained PATs where `gh pr create`'s GraphQL call may not.
          if ! pr_number=$(GH_TOKEN="$DOCS_PAT" gh api "repos/$GITHUB_REPOSITORY/pulls" \
            -f title='📚 Auto-update API documentation' \
            -f head="$branch_name" -f base=main -F "body=@$pr_body" --jq '.number'); then
            echo "::error::PR creation failed. Branch $branch_name was pushed; inspect it before manual cleanup." >&2
            exit 1
          fi
          if [[ ! $pr_number =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::PR creation returned no number. Branch $branch_name was pushed; inspect it before manual cleanup." >&2
            exit 1
          fi
          echo "✅ Documentation PR created: #$pr_number ($branch_name)"

          GH_TOKEN="$DOCS_PAT" gh api "repos/$GITHUB_REPOSITORY/issues/$pr_number/labels" \
            -f 'labels[]=documentation' -f 'labels[]=automated' \
            || echo "⚠️ Could not add labels to PR #$pr_number"

  spell-check:
    name: Spell Check Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Run spell check
        uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58 # v7
        with:
          files: '**/*.md'
          config: '.github/cspell.json'
          inline: 'error'
          incremental_files_only: false
          strict: false
          verbose: true

  accessibility-check:
    name: Documentation Accessibility Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Check markdown accessibility
        run: |
          echo "## ♿ Accessibility Check Report" > accessibility-report.md
          echo "" >> accessibility-report.md

          # Check for alt text on images
          echo "### 🖼️ Image Alt Text Check" >> accessibility-report.md
          echo "" >> accessibility-report.md

          images_without_alt=0
          find . -name "*.md" -not -path "./node_modules/*" | xargs grep -n "!\[" | while read line; do
            if echo "$line" | grep -q "!\[\]"; then
              echo "⚠️ Missing alt text: $line" >> accessibility-report.md
              images_without_alt=$((images_without_alt + 1))
            fi
          done

          if [ $images_without_alt -eq 0 ]; then
            echo "✅ All images have alt text" >> accessibility-report.md
          fi

          echo "" >> accessibility-report.md

          # Check for proper heading hierarchy
          echo "### 📝 Heading Hierarchy Check" >> accessibility-report.md
          echo "" >> accessibility-report.md

          find . -name "*.md" -not -path "./node_modules/*" | while read file; do
            echo "**$file:**" >> accessibility-report.md
            grep "^#" "$file" | head -5 >> accessibility-report.md || echo "No headings found" >> accessibility-report.md
            echo "" >> accessibility-report.md
          done

      - name: Upload accessibility report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: accessibility-report
          path: accessibility-report.md
          retention-days: 30

  pr-docs-check:
    name: PR Documentation Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Check for documentation updates
        id: docs-check
        run: |
          echo "## 📚 Documentation Review" > pr-docs-report.md
          echo "" >> pr-docs-report.md

          # Check if code changes require doc updates
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "index.js"; then
            echo "🔍 **Code changes detected in index.js**" >> pr-docs-report.md
            echo "" >> pr-docs-report.md
            
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "\.md$"; then
              echo "✅ Documentation files were also updated" >> pr-docs-report.md
            else
              echo "⚠️ **Consider updating documentation** - Code changes detected but no markdown files updated" >> pr-docs-report.md
            fi
            echo "" >> pr-docs-report.md
          fi

          # Check for new MCP tools
          new_tools=$(git diff origin/${{ github.base_ref }}...HEAD index.js | grep "^+" | grep -c "name:" || echo "0")
          removed_tools=$(git diff origin/${{ github.base_ref }}...HEAD index.js | grep "^-" | grep -c "name:" || echo "0")

          if [ "$new_tools" -gt 0 ] || [ "$removed_tools" -gt 0 ]; then
            echo "🔧 **MCP Tool Changes Detected:**" >> pr-docs-report.md
            echo "- New tools: $new_tools" >> pr-docs-report.md
            echo "- Removed tools: $removed_tools" >> pr-docs-report.md
            echo "" >> pr-docs-report.md
            echo "📝 **Please ensure README.md reflects these changes**" >> pr-docs-report.md
            echo "" >> pr-docs-report.md
          fi

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const fs = require('fs');

            try {
              const report = fs.readFileSync('pr-docs-report.md', 'utf8');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } catch (error) {
              console.error('Error posting documentation review:', error);
            }

  summary:
    name: Documentation Summary
    runs-on: ubuntu-latest
    needs: [validate-docs, check-outdated-docs, spell-check, accessibility-check, generate-api-docs, create-docs-pr]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## 📖 Documentation Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Validation**: ${{ needs.validate-docs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Freshness Check**: ${{ needs.check-outdated-docs.result }}" >> $GITHUB_STEP_SUMMARY  
          echo "**Spell Check**: ${{ needs.spell-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Accessibility**: ${{ needs.accessibility-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**API Documentation**: ${{ needs.generate-api-docs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Documentation PR**: ${{ needs.create-docs-pr.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **All reports uploaded as artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Analysis completed at**: $(date -u)" >> $GITHUB_STEP_SUMMARY
