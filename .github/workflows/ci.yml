name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Check code formatting with Prettier
        run: npm run format:check

      - name: Lint markdown files
        run: npm run markdown:lint

      - name: Check for swallowed code fences
        run: npm run fences:check

      # Enforcement for the two documentation drift gates lives HERE, not in docs.yml.
      # `Code Quality & Linting` is a required status check on main and `ci.yml` carries no
      # `paths:` filter, so this runs on every PR and blocks the merge. The same two scripts
      # also run in docs.yml, but only to write the human-readable drift report - that job
      # ("Validate Documentation") is deliberately NOT required, because its link checker
      # 404s on still-private GHSA advisories and goes red during a security release.
      # Both scripts are dependency-free `node:fs` readers, so `npm ci --ignore-scripts` above
      # is enough to run them.
      - name: Check documentation is in sync
        run: npm run docs:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  windows-docker-credential-safety:
    name: Windows Docker Credential Safety
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Docker credential generation fails closed
        run: npx vitest run test/unit/detect-platform.test.js test/unit/docker-integration-entrypoint.test.js test/unit/manual-test-environment.test.js

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: sonar-${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run test coverage
        run: npm run test:coverage:verified

      - name: Create Sonar PR coverage manifest
        if: github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.id != github.event.repository.id)
        run: node scripts/ci/sonar-pr-artifact.mjs create
        env:
          SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          SONAR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SONAR_BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Upload Sonar PR coverage artifact
        if: github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.id != github.event.repository.id)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sonar-pr-lcov-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/manifest.json
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 2

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        with:
          directory: ./coverage
          # Fork and Dependabot PRs do not receive the Actions secret. Keep their
          # upload best-effort while requiring a successful upload for trusted runs.
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
          disable_search: true
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-warp-sql-server-mcp
          token: ${{ secrets.CODECOV_TOKEN }} # yamllint disable-line

      # Automatic Analysis remains active until the coordinated cutover. No
      # scanner step is eligible while SONAR_CI_ENABLED is unset or false.
      - name: Check Sonar scan freshness
        id: sonar_freshness
        if: vars.SONAR_CI_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.user.login != 'dependabot[bot]'))
        run: node scripts/ci/sonar-scan-guard.mjs preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          SONAR_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SONAR_BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Submit trusted Sonar analysis
        if: vars.SONAR_CI_ENABLED == 'true' && steps.sonar_freshness.outputs.scan == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Check for known vulnerabilities
        run: npx --ignore-scripts audit-ci@7.1.0 --config .audit-ci.json || echo "audit-ci not configured, skipping"
        continue-on-error: true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run integration tests
        run: npm run test:integration || echo "No integration tests configured"
        continue-on-error: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build project
        run: npm run build || echo "No build script configured"
        continue-on-error: true

      - name: Check bundle size
        run: npm run size-check || echo "No size-check script configured"
        continue-on-error: true
