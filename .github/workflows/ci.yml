name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Check code formatting with Prettier
        run: npm run format:check

      - name: Lint markdown files
        run: npm run markdown:lint

      - name: Check for swallowed code fences
        run: npm run fences:check

      # Enforcement for the two documentation drift gates lives HERE, not in docs.yml.
      # `Code Quality & Linting` is a required status check on main and `ci.yml` carries no
      # `paths:` filter, so this runs on every PR and blocks the merge. The same two scripts
      # also run in docs.yml, but only to write the human-readable drift report - that job
      # ("Validate Documentation") is deliberately NOT required, because its link checker
      # 404s on still-private GHSA advisories and goes red during a security release.
      # Both scripts are dependency-free `node:fs` readers, so `npm ci --ignore-scripts` above
      # is enough to run them.
      - name: Check documentation is in sync
        run: npm run docs:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  windows-docker-credential-safety:
    name: Windows Docker Credential Safety
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Docker credential generation fails closed
        run: npx vitest run test/unit/detect-platform.test.js test/unit/docker-integration-entrypoint.test.js test/unit/manual-test-environment.test.js

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: test
    # The main catch-up workflow shares sonar-main. Ordering alone cannot prove freshness.
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'sonar-main' || format('sonar-ci-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run test coverage
        run: npm run test:coverage

      - name: Validate local LCOV report
        run: node scripts/ci/sonar-lcov.mjs validate coverage/lcov.info

      - name: Create isolated-analysis coverage manifest
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.id != github.event.repository.id ||
           github.event.pull_request.user.login == 'dependabot[bot]')
        run: node scripts/ci/sonar-pr-artifact.mjs create coverage/lcov.info

      - name: Upload isolated-analysis coverage artifact
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.id != github.event.repository.id ||
           github.event.pull_request.user.login == 'dependabot[bot]')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/manifest.json
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 2
          archive: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ./coverage
          fail_ci_if_error: false
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-warp-sql-server-mcp
          token: ${{ secrets.CODECOV_TOKEN }} # yamllint disable-line
        continue-on-error: true

      - name: Check current revision immediately before Sonar scan
        id: sonar-freshness
        if: >-
          vars.SONAR_CI_ENABLED == 'true' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' &&
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.id == github.event.repository.id &&
            github.event.pull_request.user.login != 'dependabot[bot]'))
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const validSha = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
            const validId = value => Number.isSafeInteger(value) && value > 0;
            const validRef = async value => {
              // Use Git's grammar, preserving '+' and Unicode. Reject controls and
              // previous-checkout shorthand before passing the ref as one argument.
              if (typeof value !== 'string' || value.length === 0 ||
                  /[\u0000-\u0020\u007f-\u009f]/u.test(value) || value.includes('@{')) return false;
              const result = await exec.getExecOutput('git', ['check-ref-format', '--branch', value],
                { silent: true, ignoreReturnCode: true });
              return result.exitCode === 0;
            };
            const requireThat = (condition, message) => { if (!condition) throw new Error(message); };
            const checkout = await exec.getExecOutput('git', ['rev-parse', 'HEAD']);
            const checkedSha = checkout.stdout.trim();
            const expectedPr = context.payload.pull_request;
            const expectedSha = context.eventName === 'pull_request' ? expectedPr?.head?.sha : context.sha;
            requireThat(checkout.exitCode === 0 && validSha(checkedSha) && validSha(expectedSha) &&
              checkedSha === expectedSha, 'Checkout does not match the tested event revision');
            let decision;
            if (context.eventName === 'push' && context.ref === 'refs/heads/main') {
              const { data: remote } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
              requireThat(remote?.ref === 'refs/heads/main' && remote.object?.type === 'commit' &&
                validSha(remote.object.sha), 'Invalid remote main revision');
              decision = remote.object.sha === checkedSha ? 'scan' : 'superseded';
            } else if (context.eventName === 'pull_request') {
              const repositoryId = context.payload.repository?.id;
              requireThat(validId(repositoryId) && validId(expectedPr?.number) &&
                expectedPr.head?.repo?.id === repositoryId && await validRef(expectedPr.head.ref) &&
                expectedPr.base?.repo?.id === repositoryId && await validRef(expectedPr.base.ref) &&
                expectedPr.user?.login && expectedPr.user.login !== 'dependabot[bot]',
                'Invalid trusted PR event');
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: expectedPr.number });
              requireThat(pr?.number === expectedPr.number && ['open', 'closed'].includes(pr.state) &&
                typeof pr.merged === 'boolean' && validSha(pr.head?.sha) && await validRef(pr.head?.ref) &&
                validId(pr.head?.repo?.id) && validId(pr.base?.repo?.id) && await validRef(pr.base?.ref) &&
                typeof pr.user?.login === 'string' && pr.user.login.length > 0,
                'Invalid current PR API state');
              decision = pr.state === 'open' && !pr.merged && pr.head.sha === checkedSha &&
                pr.head.repo.id === repositoryId && pr.head.ref === expectedPr.head.ref &&
                pr.base.repo.id === repositoryId && pr.base.ref === expectedPr.base.ref &&
                pr.user.login === expectedPr.user.login ? 'scan' : 'superseded';
            } else {
              throw new Error('Unsupported direct scanner event');
            }
            const message = decision === 'scan'
              ? `Sonar revision verified: ${checkedSha}`
              : 'Sonar scan superseded: the PR state or remote main revision changed after coverage.';
            core.info(message);
            await core.summary.addRaw(message + '\n').write();
            core.setOutput('sha', checkedSha);
            core.setOutput('decision', decision);

      - name: Scan trusted revision with Sonar
        id: sonar-scan
        if: >-
          vars.SONAR_CI_ENABLED == 'true' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' &&
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.id == github.event.repository.id &&
            github.event.pull_request.user.login != 'dependabot[bot]')) &&
          steps.sonar-freshness.outputs.decision == 'scan'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dsonar.scm.revision=${{ steps.sonar-freshness.outputs.sha }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Check for known vulnerabilities
        run: npx --ignore-scripts audit-ci@7.1.0 --config .audit-ci.json || echo "audit-ci not configured, skipping"
        continue-on-error: true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run integration tests
        run: npm run test:integration || echo "No integration tests configured"
        continue-on-error: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build project
        run: npm run build || echo "No build script configured"
        continue-on-error: true

      - name: Check bundle size
        run: npm run size-check || echo "No size-check script configured"
        continue-on-error: true
