name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  # Manual re-run without another package.json push - after a failed publish, or after a
  # tag was created late. Safe to dispatch at any time: the "Check if this is a release
  # version bump" step below publishes only when a tag matching package.json exists AND
  # that version is not yet on npm, and skips otherwise.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token: npm Trusted Publishing auth + provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22' # latest 22.x; trusted publishing needs Node 22.14.0+
          # No dependency cache in the publishing job. setup-node's trusted-publisher guide:
          # "a poisoned cache may expose credentials (including OIDC tokens) to
          # attacker-controlled code". package.json sets no packageManager, so this only
          # makes the default explicit; the other workflows keep cache: 'npm'.
          package-manager-cache: false
          # Kept on purpose. This writes the registry plus an auth line that reads
          # NODE_AUTH_TOKEN into .npmrc. No token is set anywhere in this job: npm leaves the
          # unset ${NODE_AUTH_TOKEN} placeholder alone and authenticates with the OIDC token
          # instead (setup-node v7 README: "npm Trusted Publishing (OIDC) is not affected,
          # since it does not use NODE_AUTH_TOKEN").
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check if this is a release version bump
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          # Only publish if a matching release tag exists
          if ! git rev-parse "v$PKG_VERSION" >/dev/null 2>&1; then
            echo "No tag v$PKG_VERSION found — skipping (not a release bump)"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if already published to avoid overwrite errors
          if npm view "@egarcia74/warp-sql-server-mcp@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "v$PKG_VERSION already on npm — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "Will publish @egarcia74/warp-sql-server-mcp@$PKG_VERSION"

      # npm Trusted Publishing requires npm 11.5.1+ (docs.npmjs.com/trusted-publishers) and
      # Node 22 bundles npm 10.x. Pinned to an exact version, not a range: this job holds the
      # publish credential, so the npm that runs in it is reviewed like any other dependency
      # (Sonar githubactions:S8543). Bump deliberately; the check below is the floor, not the
      # pin. npm has no install scripts; --ignore-scripts is defence in depth only. The check
      # turns a too-old npm into a clear failure here rather than an opaque auth error at
      # `npm publish`.
      - name: Upgrade npm for trusted publishing
        if: steps.check.outputs.should_publish == 'true'
        run: |
          npm install -g npm@11.19.1 --ignore-scripts
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          node -e '
            const have = process.argv[1].split(".").map(Number);
            const need = [11, 5, 1];
            for (let i = 0; i < 3; i++) {
              if (have[i] > need[i]) break;
              if (have[i] < need[i]) {
                console.error(`npm ${process.argv[1]} is below 11.5.1, which trusted publishing requires`);
                process.exit(1);
              }
            }
          ' "$NPM_VERSION"

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: npm run test:unit

      # The tag is created before the version bump (release.yml tags main as it stands,
      # then opens the bump PR), so HEAD here is the bump merge commit and never the
      # tagged commit. What must hold is that nothing else landed in between - see #1189.
      #
      # Deliberately the last step before publishing, not the first: an unpacked file
      # that changed inside the release window is allowed through with a notice, and
      # anything running after this gate - the test suite included - could still write
      # into a packed path. Comparing immediately before `npm publish` is what makes
      # this authoritative over the tree that actually gets packed.
      - name: Verify this tree matches the release tag
        if: steps.check.outputs.should_publish == 'true'
        env:
          PKG_VERSION: ${{ steps.check.outputs.version }}
        run: node scripts/ci/verify-publish-tree.mjs "$PKG_VERSION"

      # Authenticates with the job's OIDC token (npm Trusted Publishing) - there is no
      # NODE_AUTH_TOKEN / NPM_TOKEN in this job. The trusted publisher configured on
      # npmjs.com must name this repository and this file (npm-publish.yml); see
      # docs/operations/RELEASE-TOKEN-SETUP.md. Trusted publishing generates the provenance
      # attestation on its own; --provenance is kept so the intent stays visible here.
      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public --provenance

      - name: Summary
        if: steps.check.outputs.should_publish == 'true'
        env:
          PKG_VERSION: ${{ steps.check.outputs.version }}
        run: |
          echo "## Published @egarcia74/warp-sql-server-mcp@${PKG_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/@egarcia74/warp-sql-server-mcp/v/${PKG_VERSION}" \
            >> "$GITHUB_STEP_SUMMARY"
