name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  # Manual retry from main without another package.json push, after a failed publish or
  # a late tag. Dispatch with `gh workflow run npm-publish.yml --ref main`. The job
  # admission below rejects other refs before checkout; tag/version checks still decide
  # whether an admitted main run has anything to publish.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    # GitHub expression string equality ignores case. The required environment's exact-main
    # branch restriction must reject case variants; this YAML guard is defense in depth.
    if: ${{ github.repository == 'egarcia74/warp-sql-server-mcp' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC token: npm Trusted Publishing auth + provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned to an exact release, not '24'. This job holds the publish credential, so the
          # npm that runs in it is reviewed like any other dependency (Sonar githubactions:S8543)
          # - the same rationale that pinned `npm@11.19.1` before it was removed. A floating '24'
          # would resolve a new runtime, and a different bundled npm, with no change to this
          # repository and no review. 24.21.0 is LTS (Krypton) and bundles npm 11.19.0, above the
          # 11.5.1 trusted-publishing floor; the check below is the floor, not the pin.
          node-version: '24.21.0'
          # No dependency cache in the publishing job. setup-node's trusted-publisher guide:
          # "a poisoned cache may expose credentials (including OIDC tokens) to
          # attacker-controlled code". package.json sets no packageManager, so this only
          # makes the default explicit; the other workflows keep cache: 'npm'.
          package-manager-cache: false
          # Kept on purpose. This writes the registry plus an auth line that reads
          # NODE_AUTH_TOKEN into .npmrc. No token is set anywhere in this job: npm leaves the
          # unset ${NODE_AUTH_TOKEN} placeholder alone and authenticates with the OIDC token
          # instead (setup-node v7 README: "npm Trusted Publishing (OIDC) is not affected,
          # since it does not use NODE_AUTH_TOKEN").
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check if this is a release version bump
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          # Only publish if a matching release tag exists
          if ! git rev-parse "v$PKG_VERSION" >/dev/null 2>&1; then
            echo "No tag v$PKG_VERSION found — skipping (not a release bump)"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if already published to avoid overwrite errors
          if npm view "@egarcia74/warp-sql-server-mcp@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "v$PKG_VERSION already on npm — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "Will publish @egarcia74/warp-sql-server-mcp@$PKG_VERSION"

      # npm Trusted Publishing requires npm 11.5.1+ (docs.npmjs.com/trusted-publishers).
      # This job runs on Node 24 so the bundled npm already satisfies that floor without a
      # mutable `npm install -g ...` in the credentialed publishing job.
      - name: Verify npm version for trusted publishing
        if: steps.check.outputs.should_publish == 'true'
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          node -e '
            const have = process.argv[1].split(".").map(Number);
            const need = [11, 5, 1];
            for (let i = 0; i < 3; i++) {
              if (have[i] > need[i]) break;
              if (have[i] < need[i]) {
                console.error(`npm ${process.argv[1]} is below 11.5.1, which trusted publishing requires`);
                process.exit(1);
              }
            }
          ' "$NPM_VERSION"

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: npm run test:unit

      # The tag is created before the version bump (release.yml tags main as it stands,
      # then opens the bump PR), so HEAD here is the bump merge commit and never the
      # tagged commit. What must hold is that nothing else landed in between - see #1189.
      #
      # Deliberately the last step before publishing, not the first: an unpacked file
      # that changed inside the release window is allowed through with a notice, and
      # anything running after this gate - the test suite included - could still write
      # into a packed path. Comparing immediately before `npm publish` is what makes
      # this authoritative over the tree that actually gets packed.
      - name: Verify this tree matches the release tag
        if: steps.check.outputs.should_publish == 'true'
        env:
          PKG_VERSION: ${{ steps.check.outputs.version }}
        run: node scripts/ci/verify-publish-tree.mjs "$PKG_VERSION"

      # Authenticates with the job's OIDC token (npm Trusted Publishing) - there is no
      # NODE_AUTH_TOKEN / NPM_TOKEN in this job. The trusted publisher configured on
      # npmjs.com must name this repository, this file (npm-publish.yml), and the
      # npm-publish environment. GitHub must restrict that environment to the main
      # branch; see docs/operations/RELEASE-TOKEN-SETUP.md. Trusted publishing generates
      # the provenance attestation on its own; --provenance keeps the intent visible.
      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public --provenance

      - name: Summary
        if: steps.check.outputs.should_publish == 'true'
        env:
          PKG_VERSION: ${{ steps.check.outputs.version }}
        run: |
          echo "## Published @egarcia74/warp-sql-server-mcp@${PKG_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/@egarcia74/warp-sql-server-mcp/v/${PKG_VERSION}" \
            >> "$GITHUB_STEP_SUMMARY"
