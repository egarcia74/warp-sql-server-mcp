name: Dependabot Auto-Merge

on:
  pull_request:
    # `edited` matters: Dependabot rewrites a PR title when it regroups or
    # rebases an update, and without it the classification from the original
    # title stands - including an auto-merge granted before a retitle.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# A regroup or rebase emits `synchronize` and `edited` close together, and the two
# runs would otherwise proceed concurrently against their own immutable copies of
# the title. The older run could then call `gh pr merge --auto` on a title it read
# as eligible *after* the newer run called `--disable-auto` on the corrected one,
# silently re-queuing a held update. This only cuts redundant runs: GitHub does
# NOT guarantee the order of runs in a group, so correctness comes from the
# analyze step reading the live title, not from which run happens to go last.
#
# Runs the job will SKIP - a body- or base-only `edited` - go in a separate group.
# They must not touch the classification group at all: GitHub allows only one
# pending run per group, so a skip-run joining it would evict a queued
# reclassification even while not cancelling the in-flight one.
concurrency:
  group: >-
    dependabot-auto-merge-${{ github.event.pull_request.number || github.ref }}-${{
    (github.event.action == 'edited' && github.event.changes.title.from == null)
    && 'skip' || 'classify' }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    # Two conditions.
    #
    # Filter on the PR's AUTHOR, not `github.actor`. `github.actor` is whoever
    # triggered this particular event, so a maintainer correcting the title of a
    # queued Dependabot PR - the case `edited` exists to catch - would skip the
    # job entirely and leave the previous auto-merge request live. The same held
    # for a human `reopened` before this change.
    #
    # And for `edited`, require that the TITLE actually changed. `edited` also
    # fires for body and base-branch edits, and this job re-grants auto-merge
    # every time it runs - so an unrelated body edit on an eligible PR whose
    # auto-merge a human had deliberately turned off would silently turn it back
    # on. `github.event.changes.title` is present only on a title change.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && (github.event.action != 'edited' || github.event.changes.title.from != null)
    outputs:
      auto_merge: ${{ steps.analyze.outputs.auto_merge }}
      reason: ${{ steps.analyze.outputs.reason }}
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Analyze Dependabot PR
        id: analyze
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The title from the event payload, kept only to report drift. The
          # verdict is derived from the LIVE title read below - see why there.
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Read the title NOW rather than trusting the event payload. Each run
          # carries an immutable snapshot of the title as it was when the event
          # fired, and GitHub documents that the order of runs within a
          # concurrency group is NOT guaranteed - so a stale `synchronize` run can
          # be admitted after a newer `edited` run and apply an obsolete verdict,
          # re-enabling auto-merge on an update that should be held. The
          # concurrency group still cuts redundant runs, but correctness must not
          # depend on which run happens to go last.
          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq .title)

          echo "PR:    #$PR_NUMBER"
          echo "Title: $PR_TITLE"
          if [ "$PR_TITLE" != "$EVENT_TITLE" ]; then
            echo "::notice::Title changed since this run was queued - classifying the live title, not \"$EVENT_TITLE\""
          fi

          # ONE classifier, shared with dependabot-retriage.yml. This logic used to
          # be written twice - once here and once there - and every time the two
          # drifted, the copy missing a rule was the one that queued --auto. It now
          # lives in scripts/ci/classify-dependabot-pr.mjs and is unit-tested in
          # test/unit/classify-dependabot-pr.test.js, which shell in YAML never was.
          node scripts/ci/classify-dependabot-pr.mjs "$PR_TITLE" > "$RUNNER_TEMP/classification"
          cat "$RUNNER_TEMP/classification"

          # Forward only the keys a downstream job reads, and only the FIRST
          # occurrence of each - never `cat` the whole file into GITHUB_OUTPUT.
          # A later duplicate key overrides an earlier one there, so a forged
          # second line would override the verdict the classifier just computed.
          # The classifier now refuses to emit a control character, which is the
          # root fix; this makes the property hold at the boundary too. `grep -m1`
          # exits non-zero on a missing key, which under `set -e` fails the step
          # rather than proceeding with an unset verdict.
          for key in auto_merge decision rule reason bump_type; do
            grep -m1 "^${key}=" "$RUNNER_TEMP/classification" >> "$GITHUB_OUTPUT"
          done

          auto_merge=$(grep -m1 '^auto_merge=' "$RUNNER_TEMP/classification" | cut -d= -f2)

          # Whether to post the security notice is decided from the LIVE title too.
          # It used to be `contains(github.event.pull_request.title, 'security')` on
          # the notice step, which is the immutable event snapshot this step stopped
          # trusting - so in the window where a title changes between event and run,
          # the notice could describe a title that was never classified. Case
          # -insensitive to match the `contains()` it replaces. Cosmetic either way,
          # but there is no reason for two steps in one job to read different titles.
          if printf '%s' "$PR_TITLE" | grep -qiE 'security|vulnerability'; then
            echo "contains_security=true" >> "$GITHUB_OUTPUT"
          else
            echo "contains_security=false" >> "$GITHUB_OUTPUT"
          fi
          # Both directions, because a retitle can move a PR either way and a stale
          # label contradicts the merge state: a regrouped PR that becomes a
          # parseable patch would otherwise queue for auto-merge still wearing
          # manual-review-required, and the reverse leaves auto-merge-eligible on a
          # held PR. The re-triage workflow already clears the opposing label.
          # One `gh pr edit` call, not two: add and remove in the same request so a
          # run cancelled between them cannot leave the PR wearing both labels or
          # neither. Concurrency already keeps two classification runs for one PR
          # from overlapping, but cancellation is exactly what that mechanism does.
          if [ "$auto_merge" = "true" ]; then
            add="auto-merge-eligible"; drop="manual-review-required"
          else
            add="manual-review-required"; drop="auto-merge-eligible"
          fi
          gh pr edit "$PR_NUMBER" --add-label "$add" --remove-label "$drop" \
            || echo "Warning: Could not set labels (they may not exist yet)"

      - name: Enable auto-merge
        if: steps.analyze.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_number=$PR_NUMBER
          gh pr merge "$pr_number" --auto --squash --delete-branch

      # A "false" verdict has to *revoke* auto-merge, not just decline to grant it.
      # `gh pr merge --auto` is sticky: once queued, GitHub merges the PR as soon as the
      # required checks pass. So a PR queued by an earlier run - before these hold rules
      # existed, by the re-triage workflow, or by hand - stays queued while the
      # notify-manual-review job tells reviewers auto-merge is disabled. Idempotent: it is
      # a no-op when auto-merge was never enabled.
      - name: Disable auto-merge when held for manual review
        if: steps.analyze.outputs.auto_merge == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Fail closed. `|| echo` here would turn a transient API, auth or permission
          # failure into a green step, and notify-manual-review would then tell reviewers
          # auto-merge is disabled while the sticky request was still live. So tolerate
          # only the verified "was never enabled" case: read the state, act, re-read.
          state=$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq 'if .autoMergeRequest then "enabled" else "absent" end')
          if [ "$state" = "absent" ]; then
            echo "Auto-merge was not enabled - nothing to revoke"
            exit 0
          fi

          echo "Auto-merge is enabled on #$PR_NUMBER - revoking"
          gh pr merge "$PR_NUMBER" --disable-auto

          after=$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq 'if .autoMergeRequest then "enabled" else "absent" end')
          if [ "$after" != "absent" ]; then
            echo "::error::Failed to revoke auto-merge on #$PR_NUMBER - it is still queued and will merge when checks pass"
            exit 1
          fi
          echo "Auto-merge revoked"

      - name: Add security notice for critical updates
        if: steps.analyze.outputs.auto_merge == 'true' && steps.analyze.outputs.contains_security == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_number=$PR_NUMBER
          
          gh pr comment $pr_number --body "🚨 **Security Update Notice**

          This PR contains security updates and has been prioritized for auto-merge.

          📋 **Post-merge actions:**
          - [ ] Monitor application logs for any issues
          - [ ] Verify MCP server functionality
          - [ ] Check for any breaking changes in production
          
          🔍 **Security impact:** This update addresses known vulnerabilities and improves security posture.
          
          ⚡ **Auto-merge enabled** - will merge automatically once all CI checks pass."

  # Posts the counterpart notice whenever the auto-merge job declined to merge. It reads
  # that job's decision rather than re-deriving one from the PR title: a duplicate title
  # regex here could never cover the major-version class (Dependabot titles carry version
  # numbers, not the word "major") and would drift from the classifier it is meant to
  # mirror, so a PR could be told "auto-merge disabled" while it was merging.
  notify-manual-review:
    name: Notify Manual Review Required
    runs-on: ubuntu-latest
    needs: auto-merge
    # Fire whenever the classifier returned a definite "no", INCLUDING when the auto-merge
    # job then failed. Gating on result == 'success' meant a failed revocation - the one
    # case where a PR is held on paper but still queued to merge - suppressed the only
    # warning reviewers get. always() is required because a job-level `if` otherwise
    # carries an implicit success(); the auto_merge == 'false' test still excludes the
    # skipped job on non-Dependabot PRs, where every output is empty.
    if: always() && needs.auto-merge.outputs.auto_merge == 'false'
    permissions:
      pull-requests: write
    steps:
      - name: Post the manual-review notice
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so `gh` has no git remote to infer the repository
          # from, and every `gh pr` call here used to fail with "not a git repository".
          # GH_REPO supplies the context without fetching the tree.
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ needs.auto-merge.outputs.reason }}
          CLASSIFIER_RESULT: ${{ needs.auto-merge.result }}
        run: |
          # A failed auto-merge job most likely failed in the revocation step, which
          # means the PR is held on paper but may still be queued to merge. Say that
          # instead of posting the routine notice: this workflow is not a required
          # status check, so its failure blocks nothing and nothing else will warn.
          if [ "$CLASSIFIER_RESULT" != "success" ]; then
            gh pr comment "$PR_NUMBER" --body "**Manual Review Required - and auto-merge may still be active**

          This update is ${REASON}, so it must not merge unattended. The run that
          classified it FAILED (${CLASSIFIER_RESULT}), most likely while revoking a
          queued auto-merge.

          Check the PR's auto-merge state by hand before relying on this hold. This
          workflow is not a required status check, so its failure does not block the
          merge; if auto-merge is still queued GitHub will merge this PR as soon as
          the required checks pass. Clear it with the merge box or
          gh pr merge $PR_NUMBER --disable-auto, then review as normal."
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --body "🔍 **Manual Review Required**

          Auto-merge was declined because this update is ${REASON}.

          📋 **Review checklist:**
          - [ ] Review CHANGELOG for breaking changes
          - [ ] Test MCP server functionality locally
          - [ ] Verify database connection stability
          - [ ] Check for API changes in dependencies
          - [ ] Run the full test suite with the new versions

          ⏸️ **Auto-merge disabled** - merge manually after review."
