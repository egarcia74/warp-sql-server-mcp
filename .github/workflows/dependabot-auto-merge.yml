name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    # Only run for Dependabot PRs
    if: github.actor == 'dependabot[bot]'
    outputs:
      auto_merge: ${{ steps.analyze.outputs.auto_merge }}
      reason: ${{ steps.analyze.outputs.reason }}
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Analyze Dependabot PR
        id: analyze
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Get PR details (safely)
          pr_number=$PR_NUMBER
          pr_labels=$(gh pr view $pr_number --json labels --jq '.labels[].name' | tr '\n' ' ')
          
          echo "PR: #$pr_number"
          echo "Title: $PR_TITLE"
          echo "Labels: $pr_labels"
          
          # Determine if this is an auto-mergeable update
          auto_merge=false

          # Extract semver bump from standard Dependabot titles, e.g.:
          # "bump <name> from 1.2.3 to 1.3.0"
          from_ver=""
          to_ver=""
          dep_name=""

          if echo "$PR_TITLE" | grep -qiE 'bump .+ from [0-9]'; then
            dep_name=$(echo "$PR_TITLE" | sed -E 's/.*bump ([^ ]+) from .*/\1/i')
            from_ver=$(echo "$PR_TITLE" | sed -nE 's/.* from ([0-9][^ ]*) to .*/\1/ip' | head -n1)
            # Anchored to the from-version rather than end-of-line: Dependabot appends
            # " in the <group> group across 1 directory" to grouped single-dependency
            # titles, and an end-of-line anchor left to_ver empty for all of them, so the
            # bump type came out "unknown" and classification fell through to keywords.
            to_ver=$(echo "$PR_TITLE" | sed -nE 's/.* from [0-9][^ ]* to ([0-9][^ ]*).*/\1/ip' | head -n1)
          fi

          bump_type="unknown"
          if [ -n "$from_ver" ] && [ -n "$to_ver" ]; then
            # Strip leading 'v' and pre-release/build metadata
            fv=$(echo "$from_ver" | sed -E 's/^v//' | cut -d- -f1 | cut -d+ -f1)
            tv=$(echo "$to_ver"   | sed -E 's/^v//' | cut -d- -f1 | cut -d+ -f1)
            fmaj=$(echo "$fv" | cut -d. -f1)
            fmin=$(echo "$fv" | cut -d. -f2)
            fpat=$(echo "$fv" | cut -d. -f3)
            tmaj=$(echo "$tv" | cut -d. -f1)
            tmin=$(echo "$tv" | cut -d. -f2)
            tpat=$(echo "$tv" | cut -d. -f3)
            if [ "$tmaj" != "$fmaj" ]; then
              bump_type="major"
            elif [ "$tmin" != "$fmin" ]; then
              bump_type="minor"
            elif [ "$tpat" != "$fpat" ]; then
              bump_type="patch"
            else
              bump_type="none"
            fi
            echo "Detected dependency: $dep_name | $from_ver -> $to_ver ($bump_type)"
          fi
          
          # Check if it's a security-critical action (require manual review)
          if echo "$PR_TITLE" | grep -qi "github/codeql-action\|step-security"; then
            echo "🔒 Security-critical action - manual review required"
            auto_merge=false
            reason="a security-critical GitHub Action"

          # Block auto-merge for core database/auth dependencies at ANY bump level.
          # This must be evaluated before the patch/minor branch below, otherwise a
          # patch bump of mssql/tedious/Azure/AWS would auto-merge while the
          # notify-manual-review job simultaneously tells reviewers it did not.
          elif echo "$PR_TITLE" | grep -qiE 'bump (@?[^ ]*(mssql|tedious)|@azure/[^ ]+|aws-sdk|@aws-sdk/[^ ]+) '; then
            echo "🔒 Core database/authentication dependency - manual review required"
            auto_merge=false
            reason="a core database or authentication dependency, held at every bump level"

          # Block auto-merge for grouped updates whose title names no dependency.
          # "bump the <group> group with N updates" carries neither a package name nor a
          # version pair, so every title-based rule above misses it and it used to reach
          # the generic "security" keyword branch below - which matched the literal group
          # names "security-actions" and "security-critical" and enabled auto-merge on
          # exactly the CodeQL/step-security actions and mssql/tedious/Azure/AWS packages
          # this workflow claims to hold. #1071 and #1136 ("bump the security-actions group
          # with 4 updates") both merged that way. An unclassifiable update gets a human.
          elif [ "$bump_type" = "unknown" ] && echo "$PR_TITLE" | grep -qiE 'the [^ ]+ group'; then
            echo "📦 Grouped update with no per-dependency version - manual review required"
            auto_merge=false
            reason="a grouped update whose title names no dependency or version, so its contents cannot be classified from the title"

          # Block auto-merge for major updates
          elif [ "$bump_type" = "major" ]; then
            echo "🚨 Major version bump detected - manual review required"
            auto_merge=false
            reason="a major version bump"

          # Auto-merge for patch/minor bumps (subject to other checks below)
          elif [ "$bump_type" = "patch" ] || [ "$bump_type" = "minor" ]; then
            echo "🩹 Patch/minor version bump detected - eligible for auto-merge"
            auto_merge=true
          
          # Check for security updates (auto-merge for most security updates)
          elif echo "$PR_TITLE" | grep -qi "security\|vulnerability\|cve\|ossf/scorecard-action"; then
            echo "🔒 Security update detected - eligible for auto-merge"
            auto_merge=true
          
          # Check for auto-mergeable GitHub Actions by analyzing title
          elif echo "$PR_TITLE" | grep -qi "actions/checkout\|actions/setup-node\|actions/upload-artifact\|actions/cache\|streetsidesoftware/cspell-action\|gaurav-nelson.*markdown-link-check"; then
            echo "🏗️ Build/utility action update - eligible for auto-merge"
            auto_merge=true
          
          # Fallback: keywords in title (some ecosystems include these)
          elif echo "$PR_TITLE" | grep -qi "\bpatch\b\|\bminor\b"; then
            echo "🩹 Patch/minor keyword detected - eligible for auto-merge"
            auto_merge=true
          
          else
            echo "🔍 Manual review required for this update"
            reason="the update could not be classified automatically"
          fi
          
          echo "auto_merge=$auto_merge" >> $GITHUB_OUTPUT
          echo "reason=${reason:-unclassified}" >> $GITHUB_OUTPUT
          
          # Add auto-merge label if eligible
          if [ "$auto_merge" = "true" ]; then
            gh pr edit $pr_number --add-label "auto-merge-eligible" || echo "Warning: Could not add label (may not exist yet)"
          else
            gh pr edit $pr_number --add-label "manual-review-required" || echo "Warning: Could not add label (may not exist yet)"
          fi

      - name: Enable auto-merge
        if: steps.analyze.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_number=$PR_NUMBER
          gh pr merge "$pr_number" --auto --squash --delete-branch

      # A "false" verdict has to *revoke* auto-merge, not just decline to grant it.
      # `gh pr merge --auto` is sticky: once queued, GitHub merges the PR as soon as the
      # required checks pass. So a PR queued by an earlier run - before these hold rules
      # existed, by the re-triage workflow, or by hand - stays queued while the
      # notify-manual-review job tells reviewers auto-merge is disabled. Idempotent: it is
      # a no-op when auto-merge was never enabled.
      - name: Disable auto-merge when held for manual review
        if: steps.analyze.outputs.auto_merge == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Fail closed. `|| echo` here would turn a transient API, auth or permission
          # failure into a green step, and notify-manual-review would then tell reviewers
          # auto-merge is disabled while the sticky request was still live. So tolerate
          # only the verified "was never enabled" case: read the state, act, re-read.
          state=$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq 'if .autoMergeRequest then "enabled" else "absent" end')
          if [ "$state" = "absent" ]; then
            echo "Auto-merge was not enabled - nothing to revoke"
            exit 0
          fi

          echo "Auto-merge is enabled on #$PR_NUMBER - revoking"
          gh pr merge "$PR_NUMBER" --disable-auto

          after=$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq 'if .autoMergeRequest then "enabled" else "absent" end')
          if [ "$after" != "absent" ]; then
            echo "::error::Failed to revoke auto-merge on #$PR_NUMBER - it is still queued and will merge when checks pass"
            exit 1
          fi
          echo "Auto-merge revoked"

      - name: Add security notice for critical updates
        if: steps.analyze.outputs.auto_merge == 'true' && (contains(github.event.pull_request.title, 'security') || contains(github.event.pull_request.title, 'vulnerability'))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_number=$PR_NUMBER
          
          gh pr comment $pr_number --body "🚨 **Security Update Notice**

          This PR contains security updates and has been prioritized for auto-merge.

          📋 **Post-merge actions:**
          - [ ] Monitor application logs for any issues
          - [ ] Verify MCP server functionality
          - [ ] Check for any breaking changes in production
          
          🔍 **Security impact:** This update addresses known vulnerabilities and improves security posture.
          
          ⚡ **Auto-merge enabled** - will merge automatically once all CI checks pass."

  # Posts the counterpart notice whenever the auto-merge job declined to merge. It reads
  # that job's decision rather than re-deriving one from the PR title: a duplicate title
  # regex here could never cover the major-version class (Dependabot titles carry version
  # numbers, not the word "major") and would drift from the classifier it is meant to
  # mirror, so a PR could be told "auto-merge disabled" while it was merging.
  notify-manual-review:
    name: Notify Manual Review Required
    runs-on: ubuntu-latest
    needs: auto-merge
    # Gate on the classifier having actually run and returned a definite "no". Supplying a
    # job-level `if` drops the implicit success() guard, so `!= 'true'` would fire on a
    # skipped auto-merge job - i.e. on every non-Dependabot PR - where the output is empty.
    if: needs.auto-merge.result == 'success' && needs.auto-merge.outputs.auto_merge == 'false'
    permissions:
      pull-requests: write
    steps:
      - name: Post the manual-review notice
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so `gh` has no git remote to infer the repository
          # from, and every `gh pr` call here used to fail with "not a git repository".
          # GH_REPO supplies the context without fetching the tree.
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ needs.auto-merge.outputs.reason }}
        run: |
          gh pr comment "$PR_NUMBER" --body "🔍 **Manual Review Required**

          Auto-merge was declined because this update is ${REASON}.

          📋 **Review checklist:**
          - [ ] Review CHANGELOG for breaking changes
          - [ ] Test MCP server functionality locally
          - [ ] Verify database connection stability
          - [ ] Check for API changes in dependencies
          - [ ] Run the full test suite with the new versions

          ⏸️ **Auto-merge disabled** - merge manually after review."
