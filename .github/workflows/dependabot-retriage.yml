name: Dependabot Re-Triage

on:
  workflow_dispatch:
    inputs:
      enable_auto_merge:
        description: "Enable auto-merge for eligible PRs (patch/minor)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      dry_run:
        description: "Dry run (print actions but do not modify PRs)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      comment_on_prs:
        description: "Leave a classification comment on each PR"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

jobs:
  triage:
    name: Re-classify Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Re-triage open Dependabot PRs
        env:
          GH_TOKEN: ${{ github.token }}
          # For workflow_dispatch, inputs are available via github.event.inputs
          ENABLE_AUTO_MERGE: ${{ github.event.inputs.enable_auto_merge || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          COMMENT_ON_PRS: ${{ github.event.inputs.comment_on_prs || 'true' }}
        run: |
          set -euo pipefail

          echo "🔎 Listing open Dependabot PRs..."
          mapfile -t prs < <(gh pr list --state open --author "dependabot[bot]" --json number,title,url --jq '.[] | "\(.number)\t\(.title)\t\(.url)"')

          if [ ${#prs[@]} -eq 0 ]; then
            echo "No open Dependabot PRs found."
            exit 0
          fi

          # Revoking a queued auto-merge must not fail silently: `|| true` would let this
          # workflow report a hold while the sticky request stayed live. This is a bulk
          # loop, so record the failure and fail the step at the end rather than aborting
          # part-way through the backlog.
          revoke_failures=0
          revoke_auto_merge() {
            local n="$1" state
            state=$(gh pr view "$n" --json autoMergeRequest --jq 'if .autoMergeRequest then "enabled" else "absent" end' 2>/dev/null) || state=""
            if [ "$state" = "absent" ]; then return 0; fi
            if [ -z "$state" ]; then
              echo "::warning::Could not read auto-merge state for #$n"
              revoke_failures=$((revoke_failures+1)); return 1
            fi
            if ! gh pr merge "$n" --disable-auto; then
              echo "::error::Failed to revoke auto-merge on #$n - it is still queued"
              revoke_failures=$((revoke_failures+1)); return 1
            fi
            echo "      auto-merge revoked on #$n"
          }

          # One place for "hold this PR": label it, revoke any queued auto-merge, then
          # comment. The comment depends on whether the revocation worked - posting the
          # routine "held for manual review" notice after a failed revocation tells the
          # reader the opposite of the truth, and the workflow_dispatch run's own failure
          # is not a status check on that PR, so nothing else would correct it.
          hold_pr() {
            local n="$1" reason="$2" revoked=0
            if [ "$DRY_RUN" = "false" ]; then
              gh pr edit "$n" --add-label "manual-review-required" || true
              gh pr edit "$n" --remove-label "auto-merge-eligible" || true
              revoke_auto_merge "$n" || revoked=1
            fi
            [ "$DRY_RUN" = "false" ] || return 0
            # The failure warning is NOT one of the optional classification comments:
            # comment_on_prs=false silences routine chatter, but a PR whose hold did not
            # take is the one case that must always be told, since this workflow is not a
            # status check on it and nothing else will say so.
            if [ "$revoked" -eq 1 ]; then
              gh pr comment "$n" --body "**Automated triage: held for manual review - and auto-merge may still be active**

          This PR is ${reason}

          Revoking its queued auto-merge FAILED, so the hold may not have taken effect. This
          workflow is a manual dispatch, not a status check on this PR, so its failure does
          not block the merge: if auto-merge is still queued GitHub will merge as soon as the
          required checks pass. Check the merge box or run
          gh pr merge $n --disable-auto, then review as normal." || true
            elif [ "$COMMENT_ON_PRS" = "true" ]; then
              gh pr comment "$n" --body "Automated triage: ${reason}" || true
            fi
          }

          for row in "${prs[@]}"; do
            number=$(echo "$row" | cut -f1)
            title=$(echo "$row" | cut -f2)

            # ONE classifier, shared with dependabot-auto-merge.yml. This file used
            # to carry its own copy of the parsing and the rule chain; every drift
            # between the two made this the more permissive one, because it was the
            # copy that kept missing a hold rule. Read the fields out of a file
            # rather than eval-ing the output: `dependency` is derived from a PR
            # title, and eval would make that a command-injection surface in a job
            # holding contents:write.
            node scripts/ci/classify-dependabot-pr.mjs "$title" > "$RUNNER_TEMP/cls"
            # -m1 throughout: take the first occurrence only, so a forged second
            # line could not override a verdict. (The classifier refuses to emit
            # control characters, which is the root fix - this holds the property
            # at the boundary as well.)
            decision=$(grep -m1 '^decision=' "$RUNNER_TEMP/cls" | cut -d= -f2)
            reason=$(grep -m1 '^reason=' "$RUNNER_TEMP/cls" | cut -d= -f2-)
            bump_type=$(grep -m1 '^bump_type=' "$RUNNER_TEMP/cls" | cut -d= -f2)
            classifier_rule=$(grep -m1 '^rule=' "$RUNNER_TEMP/cls" | cut -d= -f2)

            echo "PR #$number ($bump_type, $classifier_rule): $title"

            if [ "$decision" = "hold" ]; then
              echo " - held: $reason"
              hold_pr "$number" "held for manual review - ${reason}."
              continue
            fi

            # Reachable only on an explicit "merge". `set -euo pipefail` already
            # aborts the step if the classifier crashes - verified by stubbing node
            # to exit 1, which ends the run before any `gh pr merge` - but that
            # safety lives in one line at the top of a long block, and every branch
            # below grants auto-merge. Make the invariant local: anything that is
            # not a recognised verdict stops the run rather than falling through to
            # the eligible path.
            if [ "$decision" != "merge" ]; then
              echo "::error::Classifier returned an unrecognised decision '$decision' for #$number - refusing to treat it as auto-merge eligible"
              exit 1
            fi

            echo " - $bump_type bump: auto-merge eligible"
            if [ "$DRY_RUN" = "false" ]; then
              gh pr edit "$number" --add-label "auto-merge-eligible" || true
              gh pr edit "$number" --remove-label "manual-review-required" || true
              if [ "$ENABLE_AUTO_MERGE" = "true" ]; then
                gh pr merge "$number" --auto --squash --delete-branch || true
              fi
              if [ "$COMMENT_ON_PRS" = "true" ]; then
                gh pr comment "$number" --body "Automated triage: $bump_type version bump detected via title parsing. Marked auto-merge eligible (subject to checks)." || true
              fi
            fi
          done

          if [ "$revoke_failures" -gt 0 ]; then
            echo "::error::$revoke_failures PR(s) could not have auto-merge revoked - they may still merge on green checks"
            exit 1
          fi
