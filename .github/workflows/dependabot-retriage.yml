name: Dependabot Re-Triage

on:
  workflow_dispatch:
    inputs:
      enable_auto_merge:
        description: "Enable auto-merge for eligible PRs (patch/minor)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      dry_run:
        description: "Dry run (print actions but do not modify PRs)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      comment_on_prs:
        description: "Leave a classification comment on each PR"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

jobs:
  triage:
    name: Re-classify Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Re-triage open Dependabot PRs
        env:
          GH_TOKEN: ${{ github.token }}
          # For workflow_dispatch, inputs are available via github.event.inputs
          ENABLE_AUTO_MERGE: ${{ github.event.inputs.enable_auto_merge || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          COMMENT_ON_PRS: ${{ github.event.inputs.comment_on_prs || 'true' }}
        run: |
          set -euo pipefail

          echo "🔎 Listing open Dependabot PRs..."
          mapfile -t prs < <(gh pr list --state open --author "dependabot[bot]" --json number,title,url --jq '.[] | "\(.number)\t\(.title)\t\(.url)"')

          if [ ${#prs[@]} -eq 0 ]; then
            echo "No open Dependabot PRs found."
            exit 0
          fi

          # Revoking a queued auto-merge must not fail silently: `|| true` would let this
          # workflow report a hold while the sticky request stayed live. This is a bulk
          # loop, so record the failure and fail the step at the end rather than aborting
          # part-way through the backlog.
          revoke_failures=0
          revoke_auto_merge() {
            local n="$1" state
            state=$(gh pr view "$n" --json autoMergeRequest --jq 'if .autoMergeRequest then "enabled" else "absent" end' 2>/dev/null) || state=""
            if [ "$state" = "absent" ]; then return 0; fi
            if [ -z "$state" ]; then
              echo "::warning::Could not read auto-merge state for #$n"
              revoke_failures=$((revoke_failures+1)); return 1
            fi
            if ! gh pr merge "$n" --disable-auto; then
              echo "::error::Failed to revoke auto-merge on #$n - it is still queued"
              revoke_failures=$((revoke_failures+1)); return 1
            fi
            echo "      auto-merge revoked on #$n"
          }

          # One place for "hold this PR": label it, revoke any queued auto-merge, then
          # comment. The comment depends on whether the revocation worked - posting the
          # routine "held for manual review" notice after a failed revocation tells the
          # reader the opposite of the truth, and the workflow_dispatch run's own failure
          # is not a status check on that PR, so nothing else would correct it.
          hold_pr() {
            local n="$1" reason="$2" revoked=0
            if [ "$DRY_RUN" = "false" ]; then
              gh pr edit "$n" --add-label "manual-review-required" || true
              gh pr edit "$n" --remove-label "auto-merge-eligible" || true
              revoke_auto_merge "$n" || revoked=1
            fi
            [ "$COMMENT_ON_PRS" = "true" ] && [ "$DRY_RUN" = "false" ] || return 0
            if [ "$revoked" -eq 1 ]; then
              gh pr comment "$n" --body "**Automated triage: held for manual review - and auto-merge may still be active**

          This PR is ${reason}

          Revoking its queued auto-merge FAILED, so the hold may not have taken effect. This
          workflow is a manual dispatch, not a status check on this PR, so its failure does
          not block the merge: if auto-merge is still queued GitHub will merge as soon as the
          required checks pass. Check the merge box or run
          gh pr merge $n --disable-auto, then review as normal." || true
            else
              gh pr comment "$n" --body "Automated triage: ${reason}" || true
            fi
          }

          classify_pr() {
            local title="$1"
            local dep from to fv tv fmaj fmin fpat tmaj tmin tpat bump="unknown"
            # No `v?` here, matching dependabot-auto-merge.yml. Accepting a leading v
            # made this copy the LESS conservative of the two: `bump foo from v1.2.3 to
            # v1.2.4` parsed as a patch here and queued --auto, while the event workflow
            # left it unclassified and sent it to manual review. Both now treat a
            # v-prefixed title as unclassifiable, which is the safe direction.
            if echo "$title" | grep -qiE 'bump .+ from [0-9]'; then
              dep=$(echo "$title" | sed -E 's/.*bump ([^ ]+) from .*/\1/i')
              from=$(echo "$title" | sed -nE 's/.* from ([0-9][^ ]*) to .*/\1/ip' | head -n1)
              # Anchored to the from-version, not end-of-line: Dependabot appends
              # " in the <group> group across 1 directory" to grouped single-dependency
              # titles, and an end-of-line anchor left this empty for all of them.
              to=$(echo "$title" | sed -nE 's/.* from [0-9][^ ]* to ([0-9][^ ]*).*/\1/ip' | head -n1)
            fi
            if [ -n "${from:-}" ] && [ -n "${to:-}" ]; then
              fv=$(echo "$from" | sed -E 's/^v//' | cut -d- -f1 | cut -d+ -f1)
              tv=$(echo "$to"   | sed -E 's/^v//' | cut -d- -f1 | cut -d+ -f1)
              fmaj=${fv%%.*}; fmin=${fv#*.}; fmin=${fmin%%.*}; fpat=${fv##*.}
              tmaj=${tv%%.*}; tmin=${tv#*.}; tmin=${tmin%%.*}; tpat=${tv##*.}
              if [ "$tmaj" != "$fmaj" ]; then bump="major";
              elif [ "$tmin" != "$fmin" ]; then bump="minor";
              elif [ "$tpat" != "$fpat" ]; then bump="patch";
              else bump="none"; fi
            fi
            echo "$bump"
          }

          for row in "${prs[@]}"; do
            number=$(echo "$row" | cut -f1)
            title=$(echo "$row" | cut -f2)
            url=$(echo "$row" | cut -f3)

            bump_type=$(classify_pr "$title")
            echo "PR #$number ($bump_type): $title"

            # Security-critical action patterns
            if echo "$title" | grep -qi "github/codeql-action\|step-security"; then
              echo " - Security-critical action: manual review required"
              hold_pr "$number" "a security-critical action (CodeQL/StepSecurity), held for manual review."
              continue
            fi

            # Core database/authentication dependencies: held at every bump level.
            # MUST stay in sync with the same rule in dependabot-auto-merge.yml - without
            # it this workflow queues `--auto` on exactly the packages that one holds.
            if echo "$title" | grep -qiE 'bump (@?[^ ]*(mssql|tedious)|@azure/[^ ]+|aws-sdk|@aws-sdk/[^ ]+) '; then
              echo " - Core database/authentication dependency: manual review required"
              hold_pr "$number" "a core database or authentication dependency, held for manual review at every bump level."
              continue
            fi

            # Grouped updates whose title names no dependency or version pair. The group
            # names "security-actions" and "security-critical" contain the substring
            # "security", so without this rule they reach the keyword branch below and are
            # queued for auto-merge. Mirrors dependabot-auto-merge.yml.
            if [ "$bump_type" = "unknown" ] && echo "$title" | grep -qiE 'the [^ ]+ group'; then
              echo " - Grouped update with no per-dependency version: manual review required"
              hold_pr "$number" "a grouped update whose title names no dependency or version, so its contents cannot be classified from the title. Held for manual review."
              continue
            fi

            # Block auto-merge for any major bump regardless of keywords
            if [ "$bump_type" = "major" ]; then
              echo " - Major bump: manual review required (takes precedence over security keywords)"
              hold_pr "$number" "a major version bump detected via title parsing, held for manual review even if security-related."
              continue
            fi

            # Security update keywords: allow auto-merge (only for non‑major bumps)
            if echo "$title" | grep -qi "security\|vulnerability\|cve"; then
              echo " - Security update: eligible for auto-merge"
              if [ "$DRY_RUN" = "false" ]; then
                gh pr edit "$number" --add-label "auto-merge-eligible" || true
                gh pr edit "$number" --remove-label "manual-review-required" || true
                if [ "$ENABLE_AUTO_MERGE" = "true" ]; then
                  gh pr merge "$number" --auto --squash --delete-branch || true
                fi
              fi
              [ "$COMMENT_ON_PRS" = "true" ] && [ "$DRY_RUN" = "false" ] && gh pr comment "$number" --body "Automated triage: security-related dependency update. Auto-merge eligible (subject to checks)." || true
              continue
            fi

            case "$bump_type" in
              minor|patch)
                echo " - $bump_type bump: auto-merge eligible"
                if [ "$DRY_RUN" = "false" ]; then
                  gh pr edit "$number" --add-label "auto-merge-eligible" || true
                  gh pr edit "$number" --remove-label "manual-review-required" || true
                  if [ "$ENABLE_AUTO_MERGE" = "true" ]; then
                    gh pr merge "$number" --auto --squash --delete-branch || true
                  fi
                fi
                [ "$COMMENT_ON_PRS" = "true" ] && [ "$DRY_RUN" = "false" ] && gh pr comment "$number" --body "Automated triage: $bump_type version bump detected via title parsing. Marked auto-merge eligible (subject to checks)." || true
                ;;
              *)
                echo " - Unable to classify bump; leaving as-is"
                ;;
            esac
          done

          if [ "$revoke_failures" -gt 0 ]; then
            echo "::error::$revoke_failures PR(s) could not have auto-merge revoked - they may still merge on green checks"
            exit 1
          fi
