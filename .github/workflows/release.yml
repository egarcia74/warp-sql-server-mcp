name: Release Automation

# When scripts/release.mjs dispatches this workflow it passes a random dispatch_id, and the
# run name carries it in brackets so the script can pick its own run out of `gh run list`
# exactly, even when two dispatches land in the same moment. A manual dispatch leaves the
# input empty and the run name is just the workflow name, as before. `run-name` may use the
# github and inputs contexts.
run-name: ${{ github.workflow }}${{ inputs.dispatch_id && format(' [{0}]', inputs.dispatch_id) || '' }}

# Note: This workflow uses dynamic outputs from github-script actions.
# Step outputs (should_release, release_type, changelog, version) are set at runtime
# and may not be statically analyzable by linters - this is expected behavior.

on:
  # push:
  #   branches: [ main ]  # Disabled to prevent automatic releases on protected branch
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - prerelease
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean
      create_version_pr:
        description: 'Create PR to bump package.json and package-lock.json version'
        required: false
        default: true
        type: boolean
      # The two inputs below are set by scripts/release.mjs and may be left empty by hand.
      dispatch_id:
        description: 'Opaque id the release script uses to find this run (leave empty)'
        required: false
        default: ''
        type: string
      expected_sha:
        description: 'Full SHA the release was previewed at; the run refuses if main has moved (leave empty)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  check-changes:
    name: Check for Release-worthy Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to read git history and commits
    outputs:
      # These outputs are dynamically set by the github-script action below
      should_release: ${{ steps.check.outputs.should_release }} # yamllint disable-line rule:line-length
      release_type: ${{ steps.check.outputs.release_type }} # yamllint disable-line rule:line-length
    steps:
      # On workflow_dispatch, github.sha (GITHUB_SHA) is the tip of the dispatched ref at the
      # moment of dispatch - the commit every later job checks out and tags. When the release
      # script passes the SHA it previewed, a push to main between preview and dispatch makes
      # this step fail instead of releasing a commit nobody looked at. The value reaches the
      # shell through the environment, never by interpolation into the script.
      - name: Refuse if main moved since the preview
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::main is at $GITHUB_SHA, not the previewed $EXPECTED_SHA - re-run the preview"
            exit 1
          fi
          echo "expected_sha: ${EXPECTED_SHA:-(not set)}; github.sha: $GITHUB_SHA"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # This job spawns `node` to run the classifier. GitHub-hosted runners ship a Node,
      # but which one is theirs to change, so pin it the way every other job here does
      # rather than depend on the image. No `cache: npm` - the classifier has no
      # dependencies and this job never runs `npm ci`.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      # The conventional-commit rules are NOT written here, and must never be written here
      # again. They live in scripts/lib/release-plan.mjs and reach this step - and the
      # "Generate changelog" step below, and `npm run release`'s local preview - through
      # scripts/ci/classify-release-commits.mjs. Before #1158 the rules were transcribed
      # three times; two of the copies had already drifted (the changelog one matched
      # `feat:` but not `feat(scope):`) and six standard commit types - refactor, perf,
      # test, build, ci, style - matched nothing at all, so a window of only those computed
      # `none` and shipped nothing, indistinguishable from an empty window.
      #
      # The mapping, in full (scripts/lib/release-plan.mjs documents the reasoning):
      #
      #   major  BREAKING CHANGE / !:
      #   minor  feat / feature
      #   patch  fix / bugfix, docs / chore, perf, refactor, revert, build
      #   none   test, ci, style - recognised and counted and reported, but deliberately
      #          release nothing: neither test/ nor .github/ is in package.json "files",
      #          so no consumer of the published tarball can observe them
      #
      # Because a squash merge names the commit from the PR TITLE, this is in practice a
      # constraint on PR titles. See WARP.md "Release Process" and CONTRIBUTING.md.
      - name: Check conventional commits
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          # Through the environment, not `${{ }}` inside the script body.
          MANUAL_TYPE: ${{ inputs.release_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { execFileSync } = require('child_process');

            // git is spawned by the script, with an argument array - no shell, so a tag or
            // a commit subject is never word-split, globbed or expanded.
            const plan = JSON.parse(
              execFileSync('node', ['scripts/ci/classify-release-commits.mjs', '--from-git'], {
                encoding: 'utf8',
                maxBuffer: 64 * 1024 * 1024
              })
            );

            const since = plan.lastTag ?? 'the beginning of history';

            if (plan.commitCount === 0) {
              core.info(`No new commits since ${since} - nothing to release.`);
              core.setOutput('should_release', 'false');
              core.setOutput('release_type', 'none');
              return;
            }

            core.info(`Analyzing ${plan.commitCount} commits since ${since}:`);
            for (const commit of plan.commits) {
              core.info(`  ${commit.hash} ${commit.subject}`);
            }
            core.info(plan.summary);

            // A subject matching no type at all is the one case the author has to fix.
            if (plan.unclassified.length > 0) {
              const shown = plan.unclassified.slice(0, 10).map(s => `  - ${s}`).join('\n');
              const more = plan.unclassified.length > 10
                ? `\n  ... and ${plan.unclassified.length - 10} more`
                : '';
              core.warning(
                `${plan.unclassified.length} commit subject(s) match no conventional-commit ` +
                `type, so they contributed nothing to the release type:\n${shown}${more}`
              );
            }

            const manualType = process.env.MANUAL_TYPE;
            const forced = Boolean(manualType) && manualType !== 'auto';
            const releaseType = forced ? manualType : plan.releaseType;
            const shouldRelease = releaseType !== 'none' || process.env.DRY_RUN === 'true';

            // The point of #1158: "commits, but none of a releasing type" must never look
            // like "no commits". It is a warning, not a silent `none`.
            if (!forced && plan.releaseType === 'none') {
              core.warning(`No release from this window: ${plan.summary}`);
            }

            await core.summary
              .addHeading('Release type', 3)
              .addRaw(
                `**Decision:** \`${releaseType}\`` +
                (forced ? ` (forced by release_type=\`${manualType}\`)` : '')
              )
              .addBreak()
              .addRaw(`${plan.commitCount} commit(s) since ${since}. ${plan.summary}`)
              .write();

            core.info(`Release decision: ${shouldRelease ? 'YES' : 'NO'} (type: ${releaseType})`);

            core.setOutput('should_release', shouldRelease.toString());
            core.setOutput('release_type', releaseType);

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_release == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    permissions:
      # CodeQL Token-Permissions: Write permissions required for release operations
      # This job needs contents:write for both RELEASE_TOKEN and GITHUB_TOKEN fallback scenarios:
      # - the "Create Git tag" step's git push: requires repository write access
      # - the "Create GitHub Release" step (actions/create-release): requires contents write
      # Without write permissions, repositories lacking RELEASE_TOKEN configuration would fail
      # during tag creation and release publishing, breaking automated release workflows.
      # This is an intentional security trade-off for release pipeline functionality.
      contents: write # Required for fallback GITHUB_TOKEN to push tags and create releases
    steps:
      # Tag creation and release creation both use
      # `${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}`. `||` falls through only on
      # an empty string - an unset or differently-named secret - and does so with no
      # diagnostic. Because either credential can create the tag, a successful release is
      # not evidence the PAT was used, so report the selection up front. This is presence,
      # NOT validity: an expired or wrongly scoped PAT is still a non-empty string, so it
      # is selected, reported true, and the release fails rather than falling back.
      # Prints only the boolean, never the secret.
      - name: Report release credential
        env:
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          echo "🔑 RELEASE_TOKEN configured: $HAS_RELEASE_TOKEN"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Run linting
        run: npm run lint || npx --no-install eslint@10.10.0 .

      # Grouped by the SAME classifier that picked the release type in the check-changes
      # job above - scripts/ci/classify-release-commits.mjs over the rules in
      # scripts/lib/release-plan.mjs. This block used to carry its own narrower copy, which
      # filed every `feat(scope):` under "Other Changes" (#1158). Only the rendering below
      # belongs here; do not add classification to it.
      - name: Generate changelog
        id: changelog # This step dynamically sets the 'changelog' output
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { execFileSync } = require('child_process');
            const { readFileSync } = require('fs');

            // Read, not require: a bare `require('./package.json')` inside github-script
            // resolves relative to the action's own bundle, not the checkout. Every path
            // here is relative to the workspace, which is the step's working directory.
            const currentVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;

            const plan = JSON.parse(
              execFileSync('node', ['scripts/ci/classify-release-commits.mjs', '--from-git'], {
                encoding: 'utf8',
                maxBuffer: 64 * 1024 * 1024
              })
            );

            const section = (title, entries) =>
              entries.length === 0
                ? ''
                : `### ${title}\n${entries.map(e => `- ${e.text} (${e.hash})`).join('\n')}\n\n`;

            let changelog = `## Changes\n\n`;
            changelog += section('💥 Breaking Changes', plan.changelog.breaking);
            changelog += section('✨ New Features', plan.changelog.features);
            changelog += section('🐛 Bug Fixes', plan.changelog.fixes);
            changelog += section('📝 Other Changes', plan.changelog.other);

            changelog += `**Full Changelog**: https://github.com/${{ github.repository }}/compare/v${currentVersion}...HEAD`;

            core.setOutput('changelog', changelog);
            return changelog;

      - name: Bump version
        id: version # This step dynamically sets the 'version' output
        run: |
          RELEASE_TYPE="${{ needs.check-changes.outputs.release_type }}"
          echo "Release type: $RELEASE_TYPE"

          if [ "$RELEASE_TYPE" = "none" ]; then
            echo "No version bump needed"
            echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          else
            NEW_VERSION=$(npm version $RELEASE_TYPE --no-git-tag-version)
            CANDIDATE=${NEW_VERSION#v}
            echo "Initial bumped version: v$CANDIDATE"
            # If the tag already exists, keep bumping patch until we find a free version
            while git rev-parse "v$CANDIDATE" >/dev/null 2>&1; do
              echo "Tag v$CANDIDATE already exists. Bumping patch..."
              NEW_VERSION=$(npm version patch --no-git-tag-version)
              CANDIDATE=${NEW_VERSION#v}
            done
            echo "version=$CANDIDATE" >> $GITHUB_OUTPUT
            echo "Bumped to available version: v$CANDIDATE"
          fi

      - name: Create Git tag (without committing version bump)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          # Use authenticated git push with token
          git push https://$GITHUB_TOKEN@github.com/${{ github.repository }} "v${{ steps.version.outputs.version }}"
          echo "✅ Created and pushed tag v${{ steps.version.outputs.version }}"
          echo "ℹ️  Note: Version bump not committed to main due to branch protection"

      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }} # Dynamic output from changelog step
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

      # The changelog is built from commit subjects, so it must reach the shell through the
      # environment, never by interpolating it into the script: a subject containing a quote
      # broke the single-quoted echo (2026-09-11 dry run), and a crafted subject could have
      # executed as shell.
      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          {
            echo "## 🧪 Dry Run Summary"
            echo ""
            echo "**Would create release:** v${VERSION}"
            echo ""
            echo "**Changelog preview:**"
            printf '%s\n' "$CHANGELOG"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Post-release Notifications
    runs-on: ubuntu-latest
    needs: [check-changes, release]
    if: success() && needs.check-changes.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
    permissions:
      issues: write
    steps:
      - name: Update README badge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            console.log('🎉 Release completed successfully!');
            console.log('Consider updating documentation or notifying stakeholders.');

      - name: Create follow-up issue for documentation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;

            await github.rest.issues.create({
              owner,
              repo,
              title: `📝 Update documentation for release v${{ needs.release.outputs.version }}`,
              body: `## Post-release Documentation Tasks
              
              A new release has been created. Please review and update:
              
              - [ ] Update CHANGELOG.md with detailed changes
              - [ ] Review README.md for any needed updates
              - [ ] Update any version-specific documentation
              - [ ] Notify users about breaking changes (if any)
              - [ ] Update examples if API changed
              
              **Release**: v${{ needs.release.outputs.version }}
              **Auto-created by**: Release automation workflow`,
              labels: ['documentation', 'automated', 'post-release']
            });

  version-pr:
    name: Create Version Bump PR
    runs-on: ubuntu-latest
    needs: [check-changes, release]
    if: success() && needs.check-changes.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.create_version_pr == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Prepare version bump commit
        id: bumpfile
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          BRANCH="chore/release/v$VERSION"
          echo "Using version: $VERSION"
          echo "Using branch: $BRANCH"
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          # Ensure we have latest refs
          git fetch origin --prune
          # Create or update local branch from remote if it exists
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Remote branch exists. Checking out tracking branch: $BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            echo "Remote branch does not exist. Creating new branch: $BRANCH"
            git checkout -b "$BRANCH"
          fi
          # Update package.json AND package-lock.json (root + packages[""]) to the released tag.
          # `npm version` rewrites both files consistently and needs no node_modules (#1112).
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Only commit if there is a change
          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to v$VERSION"
            # Try normal push first using token to ensure CI triggers
            if ! git push -u "https://$PUSH_TOKEN@github.com/${{ github.repository }}" "$BRANCH"; then
              echo "Non-fast-forward push rejected. Rebasing and retrying with force-with-lease..."
              git pull --rebase origin "$BRANCH" || true
              git push --force-with-lease "https://$PUSH_TOKEN@github.com/${{ github.repository }}" "$BRANCH"
            fi
          else
            echo "No version change needed in package.json/package-lock.json"
          fi

      - name: Open pull request
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.VERSION || '${{ needs.release.outputs.version }}';
            const branch = process.env.BRANCH || `chore/release/v${{ needs.release.outputs.version }}`;
            const { owner, repo } = context.repo;

            // Check if PR already exists
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', head: `${owner}:${branch}` });
            if (prs.length > 0) {
              core.info(`PR already exists: #${prs[0].number}`);
              return;
            }

            const body = [
              `This automated PR bumps package.json and package-lock.json to v${version} to match the released tag.`,
              '',
              `- Version: v${version}`,
              `- Source workflow: Release Automation`,
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: `chore(release): bump version to v${version}`,
              head: branch,
              base: 'main',
              body
            });
            core.info(`Opened PR #${pr.data.number}`);

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [check-changes, release]
    if: always()
    steps:
      - name: Workflow summary
        run: |
          echo "## 🚀 Release Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Should Release**: ${{ needs.check-changes.outputs.should_release }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release Type**: ${{ needs.check-changes.outputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run**: ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.release.result }}" = "success" ]; then
            echo "✅ **Release Status**: Completed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.check-changes.outputs.should_release }}" = "false" ]; then
            # The check-changes job's own summary says which of the two it was: no commits
            # at all, or commits of no release-triggering type. See #1158.
            echo "⏭️ **Release Status**: Skipped - see \"Release type\" above for why" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Release Status**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
