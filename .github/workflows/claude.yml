name: Claude Code

# Responds when someone writes "@claude" in an issue, an issue comment,
# a PR review, or a PR review comment. Claude reads the thread and the code,
# runs the repo's lint/test scripts, and can push commits to a claude/*
# branch when asked.
#
# Claude does NOT run on a pull request whose head is on a fork or was opened
# by a bot, and ignores anyone without write access. The action checks out the
# PR head, and an untrusted head can execute code in this step -- via npm
# lifecycle scripts, .claude/settings.json hooks, or a .mcp.json server (the
# action force-enables project MCP servers) -- while the step holds the Claude
# credential and a write-scoped app token. None of those need a tool grant, so
# withholding shell access is not a substitute for not checking the head out.
# Requiring write access to *invoke* Claude is not sufficient either, since a
# maintainer can be induced to run it on a hostile head. See the guard step.
#
# Requires ONE of these repository secrets:
#   ANTHROPIC_API_KEY        - Anthropic Console API key
#   CLAUDE_CODE_OAUTH_TOKEN  - Pro/Max subscription token (`claude setup-token`)
# Setup: https://github.com/anthropics/claude-code-action/blob/main/docs/setup.md
# Both inputs are passed; the action uses whichever is non-empty.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # `assigned` is deliberately excluded: the mention gate below matches the
  # issue body/title, so assigning an issue that already says @claude would
  # replay a stale request. It is only useful alongside `assignee_trigger`.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    name: Claude Code
    # Gate on an @claude mention in the triggering body. Bot-authored
    # events are filtered by the action itself (allowed_bots defaults to none).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push commits to claude/* branches
      pull-requests: write # comment on and open PRs
      issues: write # comment on issues
      id-token: write # OIDC token for the action's auth exchange
      # Scopes GITHUB_TOKEN only. Claude's own CI access is granted
      # separately, via additional_permissions below.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          # Full history, not depth 1: the read-only git commands granted in
          # claude_args below are useless against a single commit - `git diff`
          # cannot reach a base ref to diff against. The whole repository is
          # ~6 MB across ~1,000 commits, and this workflow only runs on an
          # explicit @claude mention, so the extra clone time is negligible and
          # rare. This still checks out the default branch, not the PR head;
          # depth does not change which ref lands here, so the guard below is
          # unaffected.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Runs before any PR-head code is fetched: the checkout above is the
      # default branch for these event types, and this step only calls the
      # GitHub API. Event data is passed via env, never interpolated into the
      # script body.
      #
      # Claude runs only when ALL of these hold:
      #   * the actor has write access (checked first, so an unauthorized
      #     caller cannot make this workflow post anything on their behalf)
      #   * the head is in this repository, not a fork
      #   * the PR was opened by a human, not a bot
      #
      # The last two are one requirement, not two: whatever is in the head is
      # loaded by Claude Code as project configuration. A `.claude/settings.json`
      # hook or a `.mcp.json` server (the action force-enables project MCP
      # servers) executes shell without needing any tool grant, so withholding
      # the Bash allowlist is not isolation. Only a head that could have been
      # pushed by someone who already has write access is safe to check out.
      - name: Decide whether Claude may run
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' }}
        run: |
          set -euo pipefail

          # Authorize the caller before doing anything observable. The action
          # enforces this too, but only after this job has already started and
          # could have commented. Fails closed: an API error means "no".
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          if [ "$perm" != "admin" ] && [ "$perm" != "write" ]; then
            echo "::notice::$ACTOR has '$perm' permission; ignoring silently."
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IS_PR" != "true" ]; then
            echo "Issue event - no PR head to check."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.repo.full_name // "", .user.type // "", .user.login // ""] | @tsv')
          head=$(printf '%s' "$pr" | cut -f1)
          author_type=$(printf '%s' "$pr" | cut -f2)
          author=$(printf '%s' "$pr" | cut -f3)
          echo "PR #$PR_NUMBER head=${head:-<deleted fork>} author=$author ($author_type)"

          if [ "$head" != "$REPO" ]; then
            reason="its head is on a fork"
          elif [ "$author_type" = "Bot" ]; then
            # Machine-authored (Dependabot, Renovate, ...). Same-repo, but
            # nobody with write access reviewed the head before it existed,
            # and a compromised or misconfigured bot can put anything in it.
            reason="it was opened by the bot $author"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Refusing to run Claude on PR #$PR_NUMBER: $reason."
          {
            echo "run=false"
            echo "notify=true"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      # Only reached for an authorized caller, so this cannot be used by an
      # outsider to make the repository bot speak.
      - name: Say why Claude did not run
        if: steps.guard.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REASON: ${{ steps.guard.outputs.reason }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --silent \
            -f body="Claude did not run on this pull request because $REASON. This workflow checks out the PR head, and anything in that head - npm lifecycle scripts, \`.claude/settings.json\` hooks, a \`.mcp.json\` server - would execute alongside repository credentials. Review the diff and continue from a branch in this repository."

      - name: Run Claude Code
        id: claude
        if: steps.guard.outputs.run == 'true'
        uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NOTE: `use_sticky_comment` is deliberately absent. Runs are not
          # serialized, so two overlapping @claude mentions on one PR would
          # write over each other in a single shared comment. One comment per
          # invocation is the lesser evil.

          # Scopes of the app token minted by the OIDC exchange. These are NOT
          # inherited from the job's `permissions:` block, which only governs
          # GITHUB_TOKEN (unused by this action). The exchange defaults to
          # contents/pull_requests/issues write, so Claude cannot read CI
          # results or logs unless actions:read is requested here.
          additional_permissions: |
            actions: read
          # This step is reached only for heads that someone with write
          # access could have pushed, so these commands grant no privilege
          # that the caller does not already have. Do not widen the guard
          # without revisiting this list.
          #
          # --max-turns: 20 was too low to review anything substantial. Both
          # @claude review requests on the docs reorganization (#1148, #1149 -
          # 53 and 31 files) died with `error_max_turns` after ~1m45s, having
          # spent every turn gathering context and posting nothing but a
          # half-ticked todo list. The failure surfaces as a generic "Claude
          # encountered an error", so it reads like an outage rather than a
          # budget. 60 gives roughly 3x headroom on a PR that size; the real
          # backstop is `timeout-minutes: 30` on the job, and the failed run
          # burned 20 turns in under two minutes, so 60 stays well inside it.
          #
          # Read-only git commands: verified against this pinned action SHA
          # (src/modes/tag/index.ts), whose base tools are Glob/Grep/LS/Read,
          # the comment and CI MCP tools, and - only when git CLI commit
          # signing is off - git add/commit/rm. So Claude could write history
          # but not read it. Note the action's published configuration doc
          # claims read-only git is included by default; at this SHA it is not. Without `git diff` a review has to Read whole files one at
          # a time, which is what exhausted the turn budget above. These are
          # strictly read-only and expose nothing Read/Glob/Grep do not already
          # expose; they just make a review cost a handful of turns instead of
          # dozens. `git diff` is deliberately unrestricted (`:*`) so Claude can
          # scope it to a base ref.
          #
          # Passed via claude_args, NOT the `max_turns:` input: upstream issue
          # #1177 reports that input is dropped before reaching the SDK. The
          # claude_args path demonstrably works at this SHA - the failed run
          # logged "maxTurns": 20 and stopped at exactly 20.
          # Lets the reviewer run a SINGLE test file and check a claim itself
          # ("this regression test fails on the old code") instead of taking it on
          # trust; `npm run test:unit` only ever runs all of them.
          #
          # The grant names the script directly, and that spelling is load-bearing.
          # Two shapes were tried and rejected, both arbitrary code execution in a
          # job holding GITHUB_TOKEN and the OAuth token while reading
          # author-supplied PR text:
          #   Bash(npx vitest run:*)     vitest executes whatever --config,
          #                              --setupFiles and --globalSetup name.
          #   Bash(node scripts/ci/run-one-test.mjs:*)   npm's own options are accepted before the
          #                              script runs at all, and `npm run test:one
          #                              --script-shell=<path>` makes npm execute
          #                              that path as the shell instead. Verified
          #                              against the real npm, not reasoned about.
          # Naming `node scripts/ci/run-one-test.mjs` leaves no launcher options in
          # front of the script: anything after it lands in argv, where the script
          # refuses it. Same reason Bash(node:*) is absent - that would hand the
          # option surface back. `npm test` stays out too: it drives the Docker
          # integration suite, which this runner cannot support.
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(npm ci),Bash(npm run lint),Bash(npm run lint:fix),Bash(npm run format),Bash(npm run format:check),Bash(npm run test:unit),Bash(npm run test:coverage),Bash(node scripts/ci/run-one-test.mjs:*),Bash(npm run markdown:lint),Bash(npm run fences:check),Bash(npm run precommit),Bash(npm run ci)"
