name: Claude Code

# Responds when someone writes "@claude" in an issue, an issue comment,
# a PR review, or a PR review comment. Claude reads the thread and the code,
# runs the repo's lint/test scripts, and can push commits to a claude/*
# branch when asked.
#
# Claude does NOT run on pull requests from forks. The action checks out the
# PR head, and an untrusted head can execute code in this step -- via npm
# lifecycle scripts, .claude/settings.json hooks, or a .mcp.json server (the
# action force-enables project MCP servers) -- while the step holds the Claude
# credential and a write-scoped app token. Requiring write access to *invoke*
# Claude does not help, since a maintainer can be induced to run it on a
# hostile fork PR. The guard step below stops that; the tool allowlist is
# only reached for same-repo heads.
#
# Requires ONE of these repository secrets:
#   ANTHROPIC_API_KEY        - Anthropic Console API key
#   CLAUDE_CODE_OAUTH_TOKEN  - Pro/Max subscription token (`claude setup-token`)
# Setup: https://github.com/anthropics/claude-code-action/blob/main/docs/setup.md
# Both inputs are passed; the action uses whichever is non-empty.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # `assigned` is deliberately excluded: the mention gate below matches the
  # issue body/title, so assigning an issue that already says @claude would
  # replay a stale request. It is only useful alongside `assignee_trigger`.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    name: Claude Code
    # Gate on an @claude mention in the triggering body. Bot-authored
    # events are filtered by the action itself (allowed_bots defaults to none).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push commits to claude/* branches
      pull-requests: write # comment on and open PRs
      issues: write # comment on issues
      id-token: write # OIDC token for the action's auth exchange
      # Scopes GITHUB_TOKEN only. Claude's own CI access is granted
      # separately, via additional_permissions below.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      # Runs before any PR-head code is fetched: the checkout above is the
      # default branch for these event types, and this step only calls the
      # GitHub API. Event data is passed via env, never interpolated into the
      # script body.
      - name: Determine whether the PR head is trusted
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" != "true" ]; then
            echo "Issue event - no PR head to check."
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            echo "tools=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.repo.full_name // "", .user.type // "", .user.login // ""] | @tsv')
          head=$(printf '%s' "$pr" | cut -f1)
          author_type=$(printf '%s' "$pr" | cut -f2)
          author=$(printf '%s' "$pr" | cut -f3)
          echo "PR #$PR_NUMBER head=${head:-<deleted fork>} author=$author ($author_type)"

          if [ "$head" != "$REPO" ]; then
            # Fork head: arbitrary code in the checkout. Do not run at all.
            echo "::warning::Refusing to run Claude on a fork PR head ($head)."
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "tools=false" >> "$GITHUB_OUTPUT"
          elif [ "$author_type" = "Bot" ]; then
            # Same-repo but machine-authored (Dependabot, Renovate, ...). The
            # branch is trusted, but its whole purpose is to change dependency
            # versions. `npm ci` would run install scripts from the proposed
            # versions, and any `npm run` script would execute binaries out of
            # the freshly installed node_modules -- either one puts unreviewed
            # third-party code in this step alongside the credentials. Claude
            # may read and comment; it gets no shell.
            echo "::notice::Bot-authored PR ($author): running Claude without shell tools."
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            echo "tools=false" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            echo "tools=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Say why Claude did not run
        if: steps.guard.outputs.trusted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --silent \
            -f body="Claude does not run on pull requests from forks, because this workflow would execute the PR head's code alongside repository credentials. Review the diff and run the work from a same-repo branch instead."

      - name: Run Claude Code
        id: claude
        if: steps.guard.outputs.trusted == 'true'
        uses: anthropics/claude-code-action@ef8bb1e43bf303cff727a1dd0b8837029fe982a2 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NOTE: `use_sticky_comment` is deliberately absent. Runs are not
          # serialized, so two overlapping @claude mentions on one PR would
          # write over each other in a single shared comment. One comment per
          # invocation is the lesser evil.

          # Scopes of the app token minted by the OIDC exchange. These are NOT
          # inherited from the job's `permissions:` block, which only governs
          # GITHUB_TOKEN (unused by this action). The exchange defaults to
          # contents/pull_requests/issues write, so Claude cannot read CI
          # results or logs unless actions:read is requested here.
          additional_permissions: |
            actions: read
          # Shell tools are granted only for human-authored, same-repo heads
          # (guard.outputs.tools). Such a branch could only be pushed by
          # someone who already has write access, so the commands grant no
          # new privilege. Bot-authored PRs get no shell -- see the guard.
          # Do not widen the triggers without revisiting that step.
          claude_args: |
            --max-turns 20
            ${{ steps.guard.outputs.tools == 'true' && '--allowedTools "Bash(npm ci),Bash(npm run lint),Bash(npm run lint:fix),Bash(npm run format),Bash(npm run format:check),Bash(npm run test:unit),Bash(npm run test:coverage),Bash(npm run markdown:lint),Bash(npm run fences:check),Bash(npm run precommit),Bash(npm run ci)"' || '' }}
