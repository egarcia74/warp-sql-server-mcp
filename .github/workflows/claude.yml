name: Claude Code

# Responds when someone writes "@claude" in an issue, an issue comment,
# a PR review, or a PR review comment. Claude reads the thread, can run the
# repo's test/lint commands, and pushes commits to a claude/* branch when asked.
#
# Requires ONE of these repository secrets:
#   ANTHROPIC_API_KEY        - Anthropic Console API key
#   CLAUDE_CODE_OAUTH_TOKEN  - Pro/Max subscription token (`claude setup-token`)
# Setup: https://github.com/anthropics/claude-code-action/blob/main/docs/setup.md
# Both inputs are passed; the action uses whichever is non-empty.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Never cancel an in-flight Claude run: it may be mid-commit on a branch.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  claude:
    name: Claude Code
    # Gate on an @claude mention in the triggering body. Bot-authored
    # events are filtered by the action itself (allowed_bots defaults to none).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push commits to claude/* branches
      pull-requests: write # comment on and open PRs
      issues: write # comment on issues
      id-token: write # OIDC token for the action's auth exchange
      actions: read # read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@ef8bb1e43bf303cff727a1dd0b8837029fe982a2 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          claude_args: |
            --max-turns 20
            --allowedTools "Bash(npm ci),Bash(npm run lint),Bash(npm run lint:fix),Bash(npm run format),Bash(npm run format:check),Bash(npm run test:unit),Bash(npm run test:coverage),Bash(npm run markdown:lint),Bash(npm run fences:check),Bash(npm run precommit)"
