name: Sonar PR Coverage Follow-up

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# This workflow is privileged relative to a fork PR. It never executes PR code,
# installs PR dependencies, or restores PR-writable caches. All scanner inputs
# are checked against GitHub's API before SONAR_TOKEN reaches one scan step.
jobs:
  scan:
    name: Validate and scan fork or Dependabot PR
    if: vars.SONAR_CI_ENABLED == 'true' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    # A source branch has at most one active PR per base in this repository.
    # Serialize updates of the same fork branch and recheck its live PR head in-slot.
    concurrency:
      group: sonar-pr-followup-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted main helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve trusted scanner helpers
        run: |
          mkdir -m 700 "$RUNNER_TEMP/sonar-trusted"
          cp -R scripts/ci scripts/lib "$RUNNER_TEMP/sonar-trusted/"
          cp sonar-project.properties "$RUNNER_TEMP/sonar-trusted/sonar-project.properties"

      - name: Validate originating run and PR
        id: preflight
        run: node "$RUNNER_TEMP/sonar-trusted/ci/sonar-pr-followup.mjs" preflight "$ORIGIN_RUN_ID"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: ${{ github.event.workflow_run.id }}

      - name: Download and inspect validated artifact
        if: steps.preflight.outputs.scan == 'true'
        run: python3 "$RUNNER_TEMP/sonar-trusted/ci/sonar-artifact-archive.py" download "$ARTIFACT_ID" "$ARCHIVE_DIGEST"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.preflight.outputs.artifact_id }}
          ARCHIVE_DIGEST: ${{ steps.preflight.outputs.archive_digest }}

      - name: Checkout verified PR head
        if: steps.preflight.outputs.scan == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          repository: ${{ steps.preflight.outputs.head_repo }}
          ref: ${{ steps.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          # Reviewed exception: only static source data is read after checkout.
          # No fork script, dependency install, or PR-writable cache runs here.
          allow-unsafe-pr-checkout: true

      - name: Validate checked-out source and LCOV
        if: steps.preflight.outputs.scan == 'true'
        id: verified
        run: node "$RUNNER_TEMP/sonar-trusted/ci/sonar-pr-followup.mjs" verify-download "$RUNNER_TEMP/sonar-artifact"

      - name: Recheck current PR before scanning
        if: steps.verified.outputs.verified == 'true'
        id: final_read
        run: node "$RUNNER_TEMP/sonar-trusted/ci/sonar-pr-followup.mjs" final-check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Fetch validated PR target branch
        if: steps.final_read.outputs.scan == 'true'
        run: node "$RUNNER_TEMP/sonar-trusted/ci/sonar-pr-followup.mjs" fetch-base

      - name: Restore trusted Sonar configuration
        if: steps.final_read.outputs.scan == 'true'
        env:
          PR_HEAD_REF: ${{ steps.preflight.outputs.head_ref }}
          PR_BASE_REF: ${{ steps.preflight.outputs.base_ref }}
        run: |
          rm -f -- sonar-project.properties
          cp -- "$RUNNER_TEMP/sonar-trusted/sonar-project.properties" sonar-project.properties
          printf 'sonar.pullrequest.branch=%s\nsonar.pullrequest.base=%s\n' "$PR_HEAD_REF" "$PR_BASE_REF" >> sonar-project.properties

      # A PR may change after this final read; the scanner is pinned to the
      # previously verified head SHA, so it never scans a different revision.
      - name: Submit isolated Sonar PR analysis
        if: steps.final_read.outputs.scan == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.working.directory=${{ runner.temp }}/sonar-working
            -Dsonar.javascript.lcov.reportPaths=${{ runner.temp }}/sonar-artifact/lcov.info
            -Dsonar.pullrequest.key=${{ steps.preflight.outputs.pr_number }}
            -Dsonar.scm.revision=${{ steps.preflight.outputs.head_sha }}

      - name: Report failed follow-up
        if: ${{ failure() }}
        env:
          ORIGIN_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -f "$RUNNER_TEMP/sonar-trusted/ci/sonar-pr-followup.mjs" ] && node "$RUNNER_TEMP/sonar-trusted/ci/sonar-pr-followup.mjs" report-failure "$ORIGIN_RUN_ID"; then
            exit 0
          fi
          if [[ "$ORIGIN_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            printf 'Sonar PR coverage follow-up failed; inspect the failed job and [originating CI run](https://github.com/egarcia74/warp-sql-server-mcp/actions/runs/%s). No scanner success is claimed.\n' "$ORIGIN_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Sonar PR coverage follow-up failed; inspect the failed job and originating CI run. No scanner success is claimed.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
